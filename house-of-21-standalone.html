<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of 21</title>
<style>
/* ==========================================================================
   HOUSE OF 21 — style.css
   A dark basement console of six CRT monitors. Single dark look by design.
   Layout: 3-column grid (status/inventory | opponent feed + log | hand/actions)
   that restacks into a scrolling column on small or short screens.
   No web fonts, no external assets: ChromeOS ships Cousine for Courier New.
   ========================================================================== */
:root {
  color-scheme: dark;
  /* palette */
  --ink: #060706;
  --char: #111311;
  --steel: #1c1f1c;
  --bezel: #282b27;
  --grey: #5a615a;
  --dirty: #d6d1bf;
  --phos: #a8c9a0;
  --phos-dim: #66816a;
  --phos-faint: rgba(168, 201, 160, 0.16);
  --green: #2f4a37;
  --red: #b4493e;
  --red-dim: #5e2722;
  --amber: #d9b45f;
  --screen: #0a120c;
  --card: #d8d3c1;
  --card-ink: #1b1b1a;
  --card-red: #9a352c;
  /* type */
  --mono: "Cousine", "Courier New", Courier, "Liberation Mono", "DejaVu Sans Mono", monospace;
  --display: "Cousine", "Courier New", Courier, monospace;
  /* runtime */
  --sx: 0px;
  --sy: 0px;
  --cw: 56px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; font-size: clamp(12px, 1.75vh, 16px); }
body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ink); color: var(--dirty);
  font-family: var(--mono); line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* ============================ ROOM + LAYERS ============================ */
.room { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; overflow: clip; }
.layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
.layer-bg { z-index: 0; transform: scale(1.04); }
.layer-frames { z-index: 2; }
.layer-fg { z-index: 3; pointer-events: none; transform: scale(1.06); }

.wall {
  position: absolute; top: -4%; right: -4%; bottom: -4%; left: -4%;
  background:
    radial-gradient(ellipse 55% 45% at 50% 4%, rgba(217, 180, 95, 0.12), transparent 70%),
    repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.28) 0 2px, transparent 2px 86px),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.2) 0 2px, transparent 2px 172px),
    radial-gradient(ellipse at 30% 70%, rgba(47, 74, 55, 0.12), transparent 60%),
    linear-gradient(#1b1c19, #0e0f0d 55%, #070807);
}
.pipe { position: absolute; border-radius: 10px; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6); }
.pipe-h { height: 16px; background: linear-gradient(#3a3d38, #1d1f1c 55%, #0b0c0b); }
.pipe-v { width: 14px; background: linear-gradient(90deg, #353833, #1b1d1a 55%, #0a0b0a); }
.p1 { top: 1.6%; left: -2%; right: -2%; }
.p2 { top: 3.4%; left: 8%; width: 30%; height: 10px; opacity: 0.8; }
.p3 { top: -2%; bottom: -2%; left: 0.6%; }
.p4 { top: -2%; height: 40%; right: 1.2%; }
.jbox { position: absolute; width: 46px; height: 58px; background: linear-gradient(#2b2e2a, #151714); border: 1px solid #000; border-radius: 3px; }
.jbox span { display: block; width: 6px; height: 6px; margin: 10px auto 0; border-radius: 50%; background: var(--red-dim); box-shadow: 0 0 6px var(--red); }
.jbox span + span { background: var(--green); box-shadow: 0 0 6px #5c9a6a; }
.jb1 { top: 46%; left: 0.3%; }
.jb2 { top: 18%; right: 0.2%; }
.bulb-cord { position: absolute; top: 0; left: 50%; width: 2px; height: 2.2vh; background: #0b0b0a; }
.bulb { position: absolute; top: 2.1vh; left: calc(50% - 7px); width: 14px; height: 14px; border-radius: 50%; background: #f1dc9b; box-shadow: 0 0 18px 6px rgba(241, 220, 155, 0.5); }
.bulb-glow { position: absolute; top: -30vh; left: 50%; width: 120vh; height: 80vh; margin-left: -60vh; background: radial-gradient(ellipse at 50% 40%, rgba(217, 180, 95, 0.1), transparent 60%); animation: bulb 7s infinite steps(1); }
.floor { position: absolute; left: -4%; right: -4%; bottom: -4%; height: 7vh; background: linear-gradient(#1d201c, #0a0b0a); border-top: 1px solid #2d302b; }
@keyframes bulb { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: 0.55; } 49% { opacity: 1; } 83% { opacity: 0.8; } 84% { opacity: 1; } }

.fg-cables { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.vignette { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.75) 100%); }
.dread { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity 1.2s; background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(94, 39, 34, 0.55) 100%); }
body.uneasy .dread { opacity: 0.35; }
body.critical .dread { opacity: 1; animation: pulse 2.6s ease-in-out infinite; }
body.critical .bulb-glow { opacity: 0.5; animation-duration: 2.5s; }
@keyframes pulse { 50% { opacity: 0.7; } }

/* =============================== CONSOLE =============================== */
.console {
  position: absolute; top: 5.2vh; bottom: 2.6vh;
  left: max(16px, 2.2vw); right: max(16px, 2.2vw);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
  grid-column-gap: 1.4vw; grid-row-gap: 1.8vh;
}
#mon1 { grid-column: 1; grid-row: 1; }
#mon2 { grid-column: 1; grid-row: 2; }
#mon3 { grid-column: 3; grid-row: 1; }
#mon4 { grid-column: 3; grid-row: 2; }
.center-stack { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 0; }
#mon5 { flex: 1 1 66%; width: 100%; min-height: 0; }
#mon6 { flex: 0 0 31%; width: 80%; margin-top: 1.6vh; min-height: 0; }

/* =============================== MONITOR =============================== */
.monitor { position: relative; display: flex; min-width: 0; min-height: 0; }
.bezel {
  flex: 1; display: flex; position: relative; min-width: 0; min-height: 0;
  padding: clamp(7px, 1.3vh, 15px) clamp(7px, 1vw, 16px) clamp(16px, 2.6vh, 28px);
  border-radius: 14px;
  background: linear-gradient(160deg, #30332e, #1b1d1a 45%, #121311);
  box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 255, 255, 0.07), inset 0 -3px 8px rgba(0, 0, 0, 0.7), 0 14px 30px rgba(0, 0, 0, 0.75);
}
.monitor-main .bezel { padding-bottom: clamp(18px, 3vh, 30px); border-radius: 18px; }
.bezel-tag {
  position: absolute; bottom: clamp(3px, 0.6vh, 7px); left: 0; right: 0;
  text-align: center; font-size: 0.56rem; letter-spacing: 0.3em; color: var(--grey);
}
.bezel-tag::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 8px; border-radius: 50%; background: #3f9a57; box-shadow: 0 0 5px #3f9a57; vertical-align: middle; }
.screen {
  flex: 1; position: relative; overflow: hidden; min-width: 0; min-height: 0;
  border-radius: 20px / 26px;
  background: radial-gradient(ellipse at 50% 45%, #142219 0%, var(--screen) 65%, #040705 100%);
  box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.95), inset 0 0 2px rgba(168, 201, 160, 0.35), 0 0 22px rgba(120, 170, 120, 0.07);
}
.screen::after {
  content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 7;
  background: rgba(168, 201, 160, 0.035);
  animation: flicker 5.5s infinite steps(1);
}
@keyframes flicker { 0% { opacity: 1; } 31% { opacity: 0.4; } 32% { opacity: 1; } 67% { opacity: 0.75; } 68% { opacity: 1; } }
.screen-inner {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  display: flex; flex-direction: column;
  padding: clamp(6px, 1.2vh, 14px) clamp(8px, 1vw, 16px);
  color: var(--phos);
  text-shadow: 0 0 6px rgba(140, 200, 140, 0.32);
  transform: translate(var(--sx), var(--sy));
}
.scanlines {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.24) 0, rgba(0, 0, 0, 0.24) 1px, transparent 1px, transparent 3px);
}
.glare {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 6; border-radius: inherit;
  background: radial-gradient(ellipse 70% 40% at 28% 6%, rgba(255, 255, 255, 0.075), transparent 70%), linear-gradient(115deg, transparent 62%, rgba(255, 255, 255, 0.025) 63%, transparent 72%);
}
body.critical .scanlines { background: repeating-linear-gradient(to bottom, rgba(40, 0, 0, 0.3) 0, rgba(40, 0, 0, 0.3) 1px, transparent 1px, transparent 3px); }

.monitor.glitch .screen-inner { transform: translate(calc(var(--sx) + 4px), var(--sy)) skewX(-3deg); opacity: 0.85; }
.monitor.glitch .screen::before {
  content: ""; position: absolute; left: 0; right: 0; top: 38%; height: 14%; z-index: 8; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgba(168, 201, 160, 0.18) 0 3px, transparent 3px 7px);
}
.monitor.hurt-flash .screen { animation: hurt 0.7s; }
@keyframes hurt { 0%, 40% { box-shadow: inset 0 0 60px rgba(180, 73, 62, 0.9); } 100% { box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.95); } }
body.shake .layer-frames .console { animation: shake 0.42s; }
@keyframes shake { 20% { transform: translate(-5px, 2px); } 40% { transform: translate(4px, -3px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, 0); } }

.scr-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font-size: 0.7rem; letter-spacing: 0.2em; color: var(--phos-dim);
  border-bottom: 1px dashed var(--phos-faint); padding-bottom: 0.3rem; margin-bottom: 0.45rem;
  flex: 0 0 auto; white-space: nowrap; overflow: hidden;
}
.scr-head > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.scr-sub { color: var(--phos); letter-spacing: 0.12em; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 6px var(--red); }
.scr-body { flex: 1 1 auto; position: relative; min-height: 0; display: flex; flex-direction: column; }
.amber { color: var(--amber); }
.red { color: var(--red); font-style: normal; }
.dim { opacity: 0.7; }

/* ============================ M1: STATUS ============================== */
.lives-row { display: flex; gap: clamp(4px, 0.7vw, 10px); margin: 0.2rem 0 0.5rem; }
.life .heart { width: clamp(22px, 4.6vh, 46px); height: auto; display: block; }
.life.on .heart path { fill: var(--red); stroke: #e07a6d; stroke-width: 1; filter: drop-shadow(0 0 4px rgba(180, 73, 62, 0.7)); }
.life.off .heart path { fill: transparent; stroke: var(--phos-dim); stroke-width: 1.2; stroke-dasharray: 2 2; opacity: 0.55; }
.life.just-off .heart path { animation: lifeoff 1.1s; }
@keyframes lifeoff { 0%, 30%, 50% { fill: var(--red); opacity: 1; } 20%, 40%, 60% { fill: transparent; } 100% { fill: transparent; } }
.life.mini .heart { width: clamp(12px, 1.9vh, 18px); }
.stat-grid { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.9rem; margin: 0; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.stat-grid dt { color: var(--phos-dim); letter-spacing: 0.15em; }
.stat-grid dd { margin: 0; }
.effects { list-style: none; margin: 0.5rem 0 0; padding: 0; font-size: 0.64rem; letter-spacing: 0.06em; overflow: auto; min-height: 0; }
.effects li { padding: 1px 0 1px 10px; position: relative; }
.effects li::before { content: "\25B8"; position: absolute; left: 0; }
.fx-good { color: var(--phos); }
.fx-bad { color: var(--red); }
.fx-warn { color: var(--amber); }
.warn-line { color: var(--red); font-size: 0.7rem; letter-spacing: 0.12em; margin: 0.5rem 0 0; animation: blink 1.4s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }

/* ============================ M2: INVENTORY ============================ */
.inv-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: clamp(4px, 0.7vh, 8px); }
.slot {
  position: relative; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 4px; border: 1px solid var(--phos-faint); border-radius: 6px; background: rgba(0, 0, 0, 0.25);
  color: var(--phos-dim); font-size: 0.58rem; letter-spacing: 0.05em; text-align: center; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.slot .icon { width: clamp(20px, 4.4vh, 38px); height: clamp(20px, 4.4vh, 38px); }
.slot.usable { color: var(--phos); border-color: rgba(168, 201, 160, 0.55); box-shadow: inset 0 0 12px rgba(168, 201, 160, 0.15); }
.slot:hover:not(.empty) { background: rgba(168, 201, 160, 0.1); border-color: var(--phos); }
.slot.empty { border-style: dashed; opacity: 0.4; cursor: default; }
.slot-key { position: absolute; top: 2px; left: 5px; font-size: 0.55rem; opacity: 0.6; }
.slot-name { line-height: 1.1; max-width: 100%; overflow: hidden; }
.inv-hint { display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; font-size: 0.58rem; line-height: 1.4; letter-spacing: 0.1em; color: var(--phos-dim); min-height: 0; }

/* ============================ CARDS ============================ */
.card {
  position: relative; flex: 0 0 auto;
  width: var(--cw); height: calc(var(--cw) * 1.4);
  border-radius: calc(var(--cw) * 0.1);
  background: linear-gradient(160deg, #e4dfcd, var(--card) 60%, #bdb7a3);
  color: var(--card-ink); text-shadow: none;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.25);
  font-weight: 700; display: inline-block; cursor: default;
}
.card.red { color: var(--card-red); }
.card .c-tl { position: absolute; top: 5%; left: 8%; font-size: calc(var(--cw) * 0.26); line-height: 0.95; display: flex; flex-direction: column; align-items: center; }
.card .c-tl i { font-style: normal; font-size: 0.85em; }
.card .c-mid { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: calc(var(--cw) * 0.52); line-height: 1; }
.card .c-br { position: absolute; bottom: 5%; right: 8%; font-size: calc(var(--cw) * 0.2); transform: rotate(180deg); }
.card .modtag { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); background: var(--red-dim); color: var(--dirty); font-size: calc(var(--cw) * 0.2); padding: 0 4px; border-radius: 3px; }
.card.cut { background: linear-gradient(160deg, #e4dfcd, #cfc6b0 60%, #a89e88); }
.card.wild { background: repeating-linear-gradient(45deg, #c9d4c2 0 6px, #b9c6b2 6px 12px); color: var(--green); }
.card.smuggled::after { content: "C"; position: absolute; top: 3px; right: 4px; font-size: calc(var(--cw) * 0.16); color: var(--amber); background: #1b1b1a; padding: 0 3px; border-radius: 2px; }
.card.back {
  background: repeating-linear-gradient(45deg, #3d1f1c 0 4px, #29130f 4px 8px);
  border: 2px solid #5e2722; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
  display: inline-flex; align-items: center; justify-content: center;
}
.back-mark { font-size: calc(var(--cw) * 0.24); color: #a24c40; letter-spacing: 0.05em; border: 1px solid #7a3a31; padding: 1px 3px; }
.card.deal-in { animation: deal 0.34s cubic-bezier(0.2, 0.8, 0.3, 1.1); }
@keyframes deal { from { transform: translate(-30px, -50px) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
.card.small { --cw: clamp(26px, 3.8vh, 46px); }
.card.tiny { --cw: clamp(22px, 2.9vh, 34px); }
.card.big { --cw: clamp(52px, 9vh, 84px); }
.card.xrayed { box-shadow: 0 0 0 2px var(--phos), 0 0 16px rgba(168, 201, 160, 0.7); }
.card.revealed { animation: flip 0.45s; }
@keyframes flip { 0% { transform: scaleX(0.05); } 100% { transform: none; } }

/* ============================ M3: HAND ============================ */
.hand-empty { margin: auto; color: var(--phos-dim); letter-spacing: 0.3em; font-size: 0.75rem; animation: blink 2s steps(1) infinite; }
.hands { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 0.5rem; }
.hands.single { --cw: clamp(40px, 7.6vh, 82px); }
.hands.split { --cw: clamp(28px, 4.6vh, 54px); justify-content: space-around; }
.hand { display: flex; flex-direction: column; gap: 0.35rem; padding: 4px 6px; border-radius: 6px; border: 1px solid transparent; }
.hands.split .hand { flex-direction: row; align-items: center; flex-wrap: wrap; }
.hand.active { border-color: var(--amber); box-shadow: inset 0 0 14px rgba(217, 180, 95, 0.15); }
.hand.busted .hand-cards { opacity: 0.55; }
.hand-label { font-size: 0.6rem; letter-spacing: 0.15em; color: var(--phos-dim); width: 100%; }
.hand.active .hand-label { color: var(--amber); }
.hand-cards { display: flex; flex-wrap: nowrap; gap: 6px; min-width: 0; }
.hand-cards.some { gap: 0; }
.hand-cards.some .card + .card { margin-left: calc(var(--cw) * -0.22); }
.hand-cards.many { gap: 0; }
.hand-cards.many .card + .card { margin-left: calc(var(--cw) * -0.48); }
.hand-total { display: flex; align-items: baseline; gap: 0.5rem; }
.tot-num { font-size: clamp(1.4rem, 4.2vh, 2.5rem); line-height: 1; color: var(--dirty); font-variant-numeric: tabular-nums; }
.hands.split .tot-num { font-size: 1.2rem; margin-left: 0.5rem; }
.soft { font-size: 0.6rem; letter-spacing: 0.2em; color: var(--phos-dim); }
.tag { font-size: 0.62rem; letter-spacing: 0.18em; padding: 1px 6px; border: 1px solid currentColor; border-radius: 3px; font-weight: 400; }
.tag.bad { color: var(--red); }
.tag.good { color: var(--amber); }
.hand-note { font-size: 0.62rem; letter-spacing: 0.12em; color: var(--amber); margin-top: 0.3rem; }

/* ============================ KEYS / BUTTONS ============================ */
.key {
  position: relative; cursor: pointer; user-select: none;
  min-height: clamp(30px, 5.2vh, 50px); padding: 4px 10px;
  border: 1px solid rgba(168, 201, 160, 0.5); border-radius: 5px;
  background: linear-gradient(#18241b, #0d150f);
  color: var(--phos); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.14em; line-height: 1.1;
  text-shadow: 0 0 6px rgba(140, 200, 140, 0.4);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 0 #000;
  transition: background 0.12s, transform 0.06s, border-color 0.12s;
}
.key:hover:not(:disabled) { background: linear-gradient(#22352a, #122016); border-color: var(--phos); }
.key:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.key:disabled { cursor: not-allowed; opacity: 0.32; text-shadow: none; }
.key.shackled { opacity: 0.6; border-color: var(--red); color: var(--red); text-decoration: line-through; }
.key.shackled::after { content: "LOCKED"; position: absolute; top: 2px; right: 4px; font-size: 0.48rem; letter-spacing: 0.1em; text-decoration: none; }
.key-primary { border-color: var(--amber); color: var(--amber); background: linear-gradient(#2a2416, #15120b); text-shadow: 0 0 8px rgba(217, 180, 95, 0.45); }
.key-primary:hover:not(:disabled) { background: linear-gradient(#3a321d, #1d1910); border-color: #f0cc78; }
.key-danger { border-color: var(--red); color: #e08578; background: linear-gradient(#2a1513, #140a09); }
.key-small { min-height: 28px; font-size: 0.66rem; padding: 3px 8px; }

.actions-body { gap: 0.45rem; }
.act-status { font-size: 0.72rem; letter-spacing: 0.14em; color: var(--phos-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
.act-status.my-turn { color: var(--amber); animation: blink 1.6s steps(1) infinite; }
.act-status.error { color: var(--red); animation: none; }
.act-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: clamp(4px, 0.8vh, 8px); }
.act-grid .key { min-height: 0; }
.key-wide { grid-column: 1 / span 2; }
#btnPrimary { flex: 0 0 auto; width: 100%; }
#mon4.your-turn .bezel { box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 0 22px rgba(217, 180, 95, 0.18), 0 14px 30px rgba(0, 0, 0, 0.75); }

/* ============================ M5: OPPONENT ============================ */
.opp-head { color: var(--phos); }
.opp-lives { display: inline-flex; gap: 3px; }
.opp-stage { overflow: hidden; }
.opp-face { position: absolute; top: 0; left: 0; right: 0; bottom: 24%; display: flex; align-items: flex-end; justify-content: center; }
.opp-face .face-svg { height: 100%; width: auto; max-width: 100%; animation: breathe 4.5s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(168, 201, 160, 0.12)); }
.opp-face .f-eyes { animation: blinkeyes 5.2s infinite; transform-origin: 100px 101px; }
@keyframes blinkeyes { 0%, 95%, 100% { transform: none; } 97% { transform: scaleY(0.1); } }
@keyframes breathe { 50% { transform: translateY(-1.5%); } }
.opp-face.bob .face-svg { animation: bob 0.35s, breathe 4.5s ease-in-out 0.35s infinite; }
@keyframes bob { 40% { transform: translateY(-3%) scale(1.01); } }
.signal-lost { display: none; position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: var(--red); letter-spacing: 0.4em; font-size: 1.2rem; }
.opp-face.eliminated .face-svg { animation: elim 1.4s forwards; }
.opp-face.eliminated .signal-lost { display: block; animation: blink 0.8s steps(1) infinite; }
@keyframes elim { 0% { opacity: 1; transform: none; } 30% { transform: skewX(12deg) translateX(8px); opacity: 0.7; } 60% { transform: scaleY(0.04); opacity: 0.9; } 100% { transform: scaleY(0.01); opacity: 0; } }
.opp-cards { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; border-top: 1px dashed var(--phos-faint); padding-top: 4px; }
.opp-hand { display: flex; align-items: center; gap: 4px; }
.opp-hand.busted .card { opacity: 0.6; }
.opp-total { font-size: 0.68rem; letter-spacing: 0.12em; margin-left: 6px; color: var(--phos); }
.opp-cards-empty { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--phos-dim); }
.xray-tag { position: absolute; top: -1.2em; right: 6px; font-size: 0.58rem; letter-spacing: 0.2em; color: var(--phos); background: var(--screen); padding: 0 6px; animation: blink 0.9s steps(1) infinite; }
.opp-speech {
  position: absolute; left: 6%; right: 6%; bottom: 27%; z-index: 3;
  padding: 0.45rem 0.7rem; border: 1px solid var(--phos-faint); border-radius: 4px;
  background: rgba(4, 8, 5, 0.86); font-size: 0.78rem; color: var(--dirty);
  opacity: 0; transform: translateY(6px); transition: opacity 0.3s, transform 0.3s; pointer-events: none;
}
.opp-speech.show { opacity: 1; transform: none; }
.speaker { display: block; font-size: 0.56rem; letter-spacing: 0.25em; color: var(--phos-dim); margin-bottom: 2px; }
.opp-speech.from-conductor .speaker { color: var(--amber); }
.typing::after { content: "\2588"; animation: blink 0.7s steps(1) infinite; margin-left: 1px; }

.conductor-band {
  position: absolute; top: 0; left: 0; right: 0; z-index: 9;
  display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.8rem;
  background: linear-gradient(rgba(10, 10, 6, 0.96), rgba(10, 10, 6, 0.88));
  border-bottom: 1px solid rgba(217, 180, 95, 0.35);
  transition: opacity 0.35s;
}
.conductor-band.out { opacity: 0; }
.cb-portrait { flex: 0 0 auto; width: clamp(34px, 6.5vh, 60px); }
.cb-portrait svg { width: 100%; height: auto; display: block; }
.cb-text { font-size: 0.8rem; color: var(--dirty); }
.cb-text .speaker { color: var(--amber); }

.m5-overlay {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 8; overflow: auto;
  background: rgba(5, 9, 6, 0.93); padding: 0.4rem 0.2rem;
}
.dossier { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem; max-width: 40rem; margin: 0 auto; }
.dossier-kicker { font-size: 0.62rem; letter-spacing: 0.25em; color: var(--phos-dim); }
.dossier-name { font-family: var(--display); font-size: clamp(1.6rem, 5vh, 2.8rem); letter-spacing: 0.12em; color: var(--dirty); line-height: 1; font-weight: 700; }
.dossier-id { font-size: 0.66rem; letter-spacing: 0.16em; color: var(--amber); }
.dossier-text { margin: 0; font-size: 0.82rem; color: var(--phos); max-width: 36rem; }
.dossier-quote { margin: 0; font-size: 0.82rem; color: var(--dirty); font-style: italic; }
.dossier-lives { display: flex; gap: 1.5rem; font-size: 0.66rem; letter-spacing: 0.2em; align-items: center; }
.dossier-lives > span { display: inline-flex; align-items: center; gap: 6px; }
.dossier-conductor { display: flex; gap: 0.6rem; align-items: center; border: 1px solid rgba(217, 180, 95, 0.3); padding: 0.4rem 0.6rem; border-radius: 4px; }
.dossier-conductor p { margin: 0; font-size: 0.76rem; color: var(--dirty); }
.dossier-conductor .speaker { color: var(--amber); }

.inter { display: flex; flex-direction: column; gap: 0.5rem; height: 100%; }
.inter-head { display: flex; flex-direction: column; gap: 0.1rem; }
.inter-kicker { font-size: 0.6rem; letter-spacing: 0.25em; color: var(--phos-dim); }
.inter-result { font-size: clamp(1.2rem, 3.6vh, 2rem); letter-spacing: 0.18em; font-weight: 700; color: var(--dirty); }
.inter-result.good { color: var(--amber); }
.inter-result.bad { color: var(--red); }
.inter-why { font-size: 0.72rem; letter-spacing: 0.08em; }
.inter-cols { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 2fr); gap: 0.8rem; flex: 1 1 auto; min-height: 0; }
.inter-label { display: block; font-size: 0.58rem; letter-spacing: 0.2em; color: var(--phos-dim); margin: 0.2rem 0; }
.mini-hand { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-bottom: 4px; }
.mini-hand > span { font-size: 0.7rem; margin-left: 4px; }
.shop-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4rem; }
.shop-item { display: flex; flex-direction: column; gap: 0.2rem; padding: 0.4rem; border: 1px solid var(--phos-faint); border-radius: 5px; font-size: 0.62rem; min-width: 0; }
.shop-item .icon { width: 26px; height: 26px; }
.shop-name { font-weight: 700; letter-spacing: 0.08em; font-size: 0.66rem; }
.shop-desc { color: var(--phos-dim); line-height: 1.25; flex: 1 1 auto; }
.shop-item.sold { opacity: 0.4; justify-content: center; align-items: center; }
.inter > .key-primary, .dossier > .key-primary { align-self: flex-end; margin-top: auto; }

/* ============================ M6: LOG ============================ */
.log-body { gap: 0.3rem; }
.log-list { list-style: none; margin: 0; padding: 0 4px 0 0; flex: 1 1 auto; min-height: 0; overflow-y: auto; font-size: 0.68rem; letter-spacing: 0.05em; scrollbar-width: thin; scrollbar-color: var(--phos-dim) transparent; }
.lg { padding: 1px 0; }
.lg-player { color: var(--phos-dim); }
.lg-sys { color: var(--grey); }
.lk-round { color: var(--amber); text-align: center; letter-spacing: 0.3em; margin-top: 4px; }
.lk-item { color: var(--amber); }
.lg-player.lk-item { color: #a89763; }
.lk-trap { color: var(--red); }
.lk-reveal { color: var(--dirty); }
.lk-win { color: var(--amber); font-weight: 700; }
.lk-lose { color: var(--red); font-weight: 700; }
.lk-dim { opacity: 0.7; }
.log-footer { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; border-top: 1px dashed var(--phos-faint); padding-top: 0.3rem; font-size: 0.64rem; letter-spacing: 0.06em; }
.log-footer b { color: var(--phos-dim); font-weight: 400; letter-spacing: 0.15em; margin-right: 4px; }

/* ============================ BANNER + MENU BTN ============================ */
.banner {
  position: absolute; top: 44%; left: 50%; z-index: 20; pointer-events: none;
  transform: translate(-50%, -50%) scale(0.9); opacity: 0;
  font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 7vh, 4.4rem); letter-spacing: 0.3em; white-space: nowrap;
  color: var(--dirty); text-shadow: 0 0 18px rgba(168, 201, 160, 0.5), 0 4px 0 #000;
  background: rgba(0, 0, 0, 0.72); padding: 0.2em 0.8em; border-top: 1px solid var(--phos-faint); border-bottom: 1px solid var(--phos-faint);
  transition: opacity 0.25s, transform 0.25s;
}
.banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.banner.good { color: var(--amber); }
.banner.bad { color: var(--red); }
.menu-btn {
  position: fixed; z-index: 30; top: calc(6px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--phos-faint);
  background: rgba(10, 14, 11, 0.85); color: var(--phos); font-size: 1.2rem; cursor: pointer;
}

/* ============================ FULL SCREENS ============================ */
.screen-full {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; overflow: auto;
  display: flex; align-items: center; justify-content: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  background:
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, #142219 0%, #070b08 60%, #030403 100%);
  color: var(--phos);
}
.title-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; }
.title-kicker { font-size: 0.7rem; letter-spacing: 0.32em; color: var(--phos-dim); }
.title-logo {
  margin: 0; font-family: var(--display); font-weight: 700; line-height: 0.9;
  font-size: clamp(3rem, 14vh, 9rem); letter-spacing: 0.08em; color: var(--dirty);
  transform: scaleY(1.25); text-shadow: 0 0 24px rgba(168, 201, 160, 0.35), 3px 0 0 rgba(180, 73, 62, 0.45), -3px 0 0 rgba(47, 74, 55, 0.6);
  animation: titleflicker 6s infinite steps(1);
}
.title-logo span { display: inline-block; font-size: 0.32em; vertical-align: middle; margin: 0 0.4em; color: var(--red); letter-spacing: 0.2em; }
@keyframes titleflicker { 0%, 100% { opacity: 1; } 42% { opacity: 0.6; } 43% { opacity: 1; } 71% { opacity: 0.85; } 72% { opacity: 1; } }
.title-menu { display: flex; flex-direction: column; gap: 0.6rem; width: min(320px, 80vw); margin-top: 1.4rem; }
.key-menu { min-height: 46px; font-size: 0.95rem; letter-spacing: 0.3em; }
.title-settings { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
.title-note { font-size: 0.66rem; letter-spacing: 0.12em; color: var(--phos-dim); margin: 0; }

.story-wrap { display: flex; align-items: center; gap: clamp(16px, 4vw, 56px); max-width: 980px; width: 100%; }
.story-portrait { flex: 0 0 auto; width: clamp(110px, 22vh, 210px); }
.story-portrait svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 18px rgba(217, 180, 95, 0.18)); }
.narrator-glyph { width: 100%; padding-top: 80%; position: relative; border: 2px solid var(--phos-dim); border-radius: 10px; }
.narrator-glyph span { position: absolute; left: 14%; bottom: 18%; width: 18%; height: 8%; background: var(--phos); animation: blink 1s steps(1) infinite; }
.story-panel { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1rem; }
.story-tag { font-size: 0.72rem; letter-spacing: 0.32em; color: var(--amber); }
.story-text { margin: 0; font-size: clamp(1rem, 2.6vh, 1.4rem); line-height: 1.55; color: var(--dirty); min-height: 7.5em; max-width: 62ch; }
.story-text.conductor-voice { color: #e6d6a6; }
.story-controls { display: flex; gap: 0.6rem; justify-content: flex-end; }

.info-wrap { width: min(860px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 1rem; }
.info-title { margin: 0; font-size: 1.5rem; letter-spacing: 0.3em; color: var(--dirty); }
.info-body { overflow: auto; min-height: 0; padding-right: 8px; }
.info-body p { color: var(--phos); font-size: 0.9rem; max-width: 70ch; }
.how { margin-bottom: 1rem; }
.how h3 { margin: 0 0 0.25rem; font-size: 0.78rem; letter-spacing: 0.25em; color: var(--amber); }
.how p { margin: 0; line-height: 1.55; }
.item-ref { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.6rem; }
.item-ref li { display: flex; gap: 0.6rem; align-items: flex-start; font-size: 0.78rem; border: 1px solid var(--phos-faint); border-radius: 5px; padding: 0.5rem; }
.item-ref .icon { flex: 0 0 auto; width: 28px; height: 28px; }
.item-ref b { display: block; color: var(--dirty); letter-spacing: 0.1em; }
.item-ref span { display: block; color: var(--phos); }
.item-ref em { display: block; color: var(--phos-dim); font-style: normal; font-size: 0.7rem; margin-top: 2px; }
#infoBack { align-self: flex-start; }

.result-wrap { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.9rem; max-width: 640px; }
.result-kicker { font-size: 0.7rem; letter-spacing: 0.3em; color: var(--phos-dim); }
.result-title { margin: 0; font-size: clamp(2.6rem, 11vh, 6rem); letter-spacing: 0.2em; transform: scaleY(1.2); }
.result-title.good { color: var(--amber); text-shadow: 0 0 22px rgba(217, 180, 95, 0.4); }
.result-title.bad { color: var(--red); text-shadow: 0 0 22px rgba(180, 73, 62, 0.45); }
.result-portrait { width: clamp(90px, 18vh, 160px); }
.result-portrait svg { width: 100%; height: auto; display: block; }
.result-sub { margin: 0; font-size: 0.95rem; line-height: 1.55; color: var(--dirty); }
.result-actions { display: flex; gap: 0.6rem; }

/* ============================ MODALS ============================ */
.modal-root { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.modal-backdrop { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.7); }
.modal {
  position: relative; width: min(720px, 100%); max-height: 100%; display: flex;
  padding: 12px 14px 14px; border-radius: 14px;
  background: linear-gradient(160deg, #30332e, #1b1d1a 45%, #121311);
  box-shadow: 0 0 0 1px #000, 0 20px 50px rgba(0, 0, 0, 0.85);
  animation: modalin 0.2s ease-out;
}
@keyframes modalin { from { transform: scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }
.modal.intake { width: min(940px, 100%); transform-origin: 0% 100%; animation: intakein 0.35s ease-out; }
@keyframes intakein { from { transform: scale(0.35) translate(-40%, 40%); opacity: 0; } to { transform: none; opacity: 1; } }
.modal.menu { width: min(380px, 100%); }
.modal.danger .modal-screen { box-shadow: inset 0 0 40px rgba(180, 73, 62, 0.35); }
.modal .scanlines { border-radius: 14px; opacity: 0.5; }
.modal-screen {
  flex: 1; min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 60px);
  border-radius: 12px / 16px; padding: 12px 14px;
  background: radial-gradient(ellipse at 50% 40%, #142219, var(--screen) 70%);
  box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.9); color: var(--phos);
}
.modal-head { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.8rem; letter-spacing: 0.2em; color: var(--dirty); border-bottom: 1px dashed var(--phos-faint); padding-bottom: 0.4rem; margin-bottom: 0.6rem; }
.modal-head span { color: var(--amber); font-size: 0.66rem; }
.modal-body { overflow: auto; min-height: 0; flex: 1 1 auto; }
.modal-foot { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: flex-end; margin-top: 0.8rem; }
.modal.menu .modal-foot { flex-direction: column; }
.modal.menu .modal-foot .key { width: 100%; }
.modal-text { font-size: 0.82rem; line-height: 1.5; margin: 0 0 0.7rem; color: var(--phos); }
.pick-cards { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; }
.pick { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; padding: 0.5rem; background: transparent; border: 1px solid var(--phos-faint); border-radius: 8px; color: var(--phos); font-size: 0.66rem; letter-spacing: 0.08em; cursor: pointer; }
.pick:hover, .pick:focus-visible { border-color: var(--amber); background: rgba(217, 180, 95, 0.08); }
.pick .card { cursor: pointer; }
.item-list { display: flex; flex-direction: column; gap: 0.4rem; }
.irow { display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.6rem; border: 1px solid var(--phos-faint); border-radius: 6px; background: rgba(0, 0, 0, 0.25); color: var(--phos); text-align: left; font-size: 0.78rem; width: 100%; }
button.irow { cursor: pointer; }
button.irow:hover:not(:disabled) { border-color: var(--amber); }
button.irow.static, button.irow:disabled { cursor: default; opacity: 1; }
.irow.focus { border-color: var(--amber); box-shadow: inset 0 0 12px rgba(217, 180, 95, 0.12); }
.irow.locked { border-style: dashed; }
.irow.sacrificed { border-color: var(--red); background: rgba(94, 39, 34, 0.35); }
.irow.sacrificed .irow-text b { text-decoration: line-through; color: var(--red); }
.irow-icon .icon { width: 30px; height: 30px; display: block; }
.irow-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.irow-text b { color: var(--dirty); letter-spacing: 0.1em; }
.irow-text em { font-style: normal; color: var(--phos-dim); font-size: 0.68rem; }
.irow-text small { font-size: 0.6rem; letter-spacing: 0.14em; color: var(--phos-dim); }
.irow-text i { font-style: normal; font-size: 0.62rem; letter-spacing: 0.14em; }
.irow-text i.ok { color: var(--amber); }
.irow-text i.no { color: var(--red); }
.sac-mark { color: var(--phos-dim); }
.irow.sacrificed .sac-mark { color: var(--red); }
.intake-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; margin-bottom: 0.6rem; }
.intake-cols h4 { margin: 0 0 0.4rem; font-size: 0.66rem; letter-spacing: 0.25em; color: var(--amber); font-weight: 400; }

/* ============================ TOOLTIP + STATIC ============================ */
.tooltip {
  position: fixed; z-index: 80; max-width: 300px; pointer-events: none;
  padding: 6px 9px; border: 1px solid var(--phos-dim); border-radius: 4px;
  background: rgba(5, 9, 6, 0.96); color: var(--dirty); font-size: 0.72rem; line-height: 1.4;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
}
.static-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; opacity: 0; image-rendering: pixelated; }

/* ============================ LOW FX + REDUCED MOTION ============================ */
body.fx-low *, body.fx-low *::before, body.fx-low *::after { animation: none !important; transition: none !important; }
body.fx-low .screen::after { display: none; }
body.fx-low .layer-bg, body.fx-low .layer-fg { transform: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ============================ SMALL / SHORT SCREENS ============================ */
@media (max-width: 980px), (max-height: 520px) {
  html { font-size: 14px; }
  body { overflow: auto; height: auto; }
  .room { position: relative; min-height: 100vh; overflow: visible; }
  .layer-bg, .layer-fg { position: fixed; transform: none; }
  .layer-frames { position: relative; }
  .console {
    position: relative; top: auto; bottom: auto; left: auto; right: auto;
    padding: 52px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: none;
    grid-template-areas: "main main" "log log" "hand act" "lives inv";
    grid-gap: 14px;
  }
  .center-stack { display: contents; }
  #mon5 { grid-area: main; height: 54vh; min-height: 320px; max-height: 520px; }
  #mon6 { grid-area: log; width: 100%; height: 200px; margin: 0; }
  #mon3 { grid-area: hand; height: 260px; }
  #mon4 { grid-area: act; height: 260px; }
  #mon1 { grid-area: lives; height: 240px; }
  #mon2 { grid-area: inv; height: 240px; }
  .hands.single { --cw: 54px; }
  .hands.split { --cw: 40px; }
  .card.small { --cw: 34px; }
  .life .heart { width: 34px; }
  .slot .icon { width: 28px; height: 28px; }
  .banner { position: fixed; }
  .fg-cables, .floor, .jbox { display: none; }
  .layer-frames .console { transform: none !important; }
}
@media (max-width: 640px) {
  .console { grid-template-columns: minmax(0, 1fr); grid-template-areas: "main" "log" "hand" "act" "lives" "inv"; }
  .intake-cols, .inter-cols { grid-template-columns: minmax(0, 1fr); }
  .shop-row { grid-template-columns: minmax(0, 1fr); }
  .story-wrap { flex-direction: column; text-align: left; }
  .story-portrait { width: 110px; }
  .title-logo { font-size: 3.4rem; }
}

/* ============================ ITEM RARITY ============================ */
/* Tier colours are injected from config.js at boot; these are fallbacks. */
:root {
  --r-common: #ece8dc;
  --r-uncommon: #8f938d;
  --r-rare: #e38a7e;
  --r-veryrare: #a3342a;
  --r-contraband: #000000;
}
.r-common { --rc: var(--r-common); }
.r-uncommon { --rc: var(--r-uncommon); }
.r-rare { --rc: var(--r-rare); }
.r-veryrare { --rc: var(--r-veryrare); }
.r-contraband { --rc: var(--dirty); }

.rar {
  display: inline-block; vertical-align: middle; white-space: nowrap;
  padding: 1px 5px; border-radius: 2px;
  font-size: 0.5rem; font-weight: 700; letter-spacing: 0.14em; line-height: 1.35;
  text-shadow: none;
}
.rar-common { background: var(--r-common); color: #151514; }
.rar-uncommon { background: var(--r-uncommon); color: #0d0e0d; }
.rar-rare { background: var(--r-rare); color: #1c0b09; }
.rar-veryrare { background: var(--r-veryrare); color: #f3e6df; }
.rar-contraband { background: var(--r-contraband); color: var(--dirty); box-shadow: 0 0 0 1px var(--dirty); }

.slot .icon { color: var(--rc); filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.6)); }
.slot::after {
  content: ""; position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; border-radius: 1px;
  background: var(--rc); opacity: 0.85;
}
.slot-rar { font-size: 0.45rem; letter-spacing: 0.14em; color: var(--rc); line-height: 1; margin-bottom: 3px; }
.slot.r-veryrare { box-shadow: inset 0 0 14px rgba(163, 52, 42, 0.35); }
.slot.r-contraband { background: #000; border-color: rgba(214, 209, 191, 0.55); box-shadow: inset 0 0 16px rgba(214, 209, 191, 0.12); }
.slot.r-contraband::after { background: repeating-linear-gradient(90deg, var(--dirty) 0 4px, transparent 4px 8px); }
.slot.r-contraband .icon { color: var(--dirty); }

.irow-icon { color: var(--rc); }
.irow-icon.r-contraband { background: #000; border-radius: 5px; padding: 3px; box-shadow: 0 0 0 1px var(--dirty); }
.irow-text b .rar { margin-left: 6px; }
.shop-item { box-shadow: inset 0 2px 0 var(--rc); }
.shop-item .icon { color: var(--rc); }
.shop-item .rar { align-self: flex-start; }
.shop-item.r-contraband { background: #000; }
.item-ref li .icon { color: var(--rc); }
.item-ref li.r-contraband { background: #000; border-color: rgba(214, 209, 191, 0.5); }
.item-ref b + .rar { margin: 2px 0 4px; }
.rarity-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin: 0 0 0.8rem; font-size: 0.72rem; color: var(--phos-dim); }
.modal.pandora .modal-screen { box-shadow: inset 0 0 40px rgba(214, 209, 191, 0.12); }
button.irow:disabled { opacity: 0.55; }
.modal-text.center { text-align: center; }

/* ============================ SPECIAL CARDS ============================ */
.card.mystery {
  background: repeating-linear-gradient(45deg, #1f2c22 0 4px, #131b15 4px 8px);
  border: 2px solid var(--phos-dim);
}
.card.mystery .back-mark { border: none; color: var(--amber); font-size: calc(var(--cw) * 0.5); text-shadow: 0 0 8px rgba(217, 180, 95, 0.6); }
.card.doll { background: repeating-linear-gradient(45deg, #dcc7c0 0 6px, #cdb3ab 6px 12px); color: var(--card-red); }
.tot-num small { font-size: 0.45em; color: var(--amber); letter-spacing: 0.05em; }

/* ============================ DOSSIER QUIRK ============================ */
.dossier-trait { margin: 0; font-size: 0.8rem; color: var(--amber); max-width: 36rem; }
.dossier-trait b { color: var(--dirty); letter-spacing: 0.22em; margin-right: 8px; font-size: 0.66rem; }

/* ============================ PORTRAIT EXTRAS ============================ */
.f-smoke { animation: smoke 3.2s ease-in-out infinite; transform-box: fill-box; }
@keyframes smoke { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: 0.45; } 100% { opacity: 0; transform: translateY(-12px); } }
.f-blush, .f-vein { transition: opacity 1.2s; }

/* ============================ MULTIPLAYER SCREENS ============================ */
.multi-wrap { width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.mp-title { margin: 0; font-size: clamp(1.4rem, 4.4vh, 2.2rem); letter-spacing: 0.3em; color: var(--dirty); text-align: center; }
.mp-sub { margin: 0; font-size: 0.85rem; letter-spacing: 0.25em; color: var(--amber); text-align: center; }
.mp-sub.blink { animation: blink 1.4s steps(1) infinite; }
.mp-note { margin: 0; font-size: 0.72rem; line-height: 1.5; color: var(--phos-dim); text-align: center; max-width: 60ch; }
.mp-notice { margin: 0; padding: 0.4rem 0.8rem; border: 1px solid var(--red); border-radius: 4px; color: #e08578; font-size: 0.78rem; letter-spacing: 0.06em; }
.mp-grid { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 1rem; width: 100%; }
.mp-card {
  display: flex; flex-direction: column; gap: 0.55rem; min-width: 0;
  padding: 0.9rem 1rem; border-radius: 12px;
  background: radial-gradient(ellipse at 50% 30%, #142219, var(--screen) 75%);
  box-shadow: 0 0 0 1px #000, inset 0 0 24px rgba(0, 0, 0, 0.9), 0 0 0 6px #1d1f1c, 0 10px 24px rgba(0, 0, 0, 0.6);
}
.mp-card h3 { margin: 0.2rem 0 0; font-size: 0.68rem; letter-spacing: 0.3em; color: var(--amber); font-weight: 400; }
.mp-card p { margin: 0; font-size: 0.8rem; line-height: 1.5; color: var(--phos); }
.mp-off { max-width: 560px; }
.mp-avatar { display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
.mp-face { width: clamp(96px, 18vh, 150px); }
.mp-face svg, .mp-seat-face svg, .target-face svg { width: 100%; height: auto; display: block; }
.mp-label { font-size: 0.6rem; letter-spacing: 0.25em; color: var(--phos-dim); }
.mp-input {
  width: 100%; min-height: 40px; padding: 6px 10px; border-radius: 5px;
  border: 1px solid rgba(168, 201, 160, 0.5); background: #050906; color: var(--dirty);
  font: 700 1rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase;
}
.mp-input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
.mp-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.mp-mode.on { border-color: var(--amber); color: var(--amber); background: linear-gradient(#2a2416, #15120b); }
.mp-rules { min-height: 3em; }
.mp-wide { width: 100%; }
.mp-join { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.5rem; }
.mp-code-input { letter-spacing: 0.4em; text-align: center; }
.mp-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
.mp-codebox { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 1rem; border: 1px dashed var(--amber); border-radius: 8px; }
.mp-code { font-size: clamp(1.8rem, 6vh, 3rem); font-weight: 700; letter-spacing: 0.35em; color: var(--dirty); user-select: all; }
.mp-seats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.6rem; width: 100%; }
.mp-seat { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.6rem; border: 1px solid var(--phos-faint); border-radius: 6px; font-size: 0.78rem; letter-spacing: 0.08em; color: var(--dirty); min-width: 0; }
.mp-seat span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mp-seat em { font-style: normal; font-size: 0.62rem; color: var(--phos-dim); }
.mp-seat em.amber { color: var(--amber); }
.mp-seat.empty { border-style: dashed; color: var(--phos-dim); }
.mp-seat-face { width: 42px; height: 46px; flex: 0 0 auto; }
.mp-seat.empty .mp-seat-face { border: 1px dashed var(--phos-faint); border-radius: 50%; }
.target-row { align-items: center; }
.target-face { width: 44px; flex: 0 0 auto; }

/* ============================ FREE-FOR-ALL TABLE ============================ */
.opp-stage.ffa .opp-face, .opp-stage.ffa .opp-cards, .opp-stage.ffa .opp-speech { display: none; }
.ffa-grid { display: none; }
.opp-stage.ffa .ffa-grid { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: grid; gap: 0.5rem; padding: 0.2rem; }
.ffa-grid.n1 { grid-template-columns: 1fr; }
.ffa-grid.n2 { grid-template-columns: 1fr 1fr; }
.ffa-grid.n3 { grid-template-columns: 1fr 1fr 1fr; }
.ffa-cell {
  position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
  border: 1px solid var(--phos-faint); border-radius: 8px; background: rgba(0, 0, 0, 0.22);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.ffa-cell.turn { border-color: var(--amber); box-shadow: inset 0 0 18px rgba(217, 180, 95, 0.18); }
.ffa-cell.out { opacity: 0.5; }
.ffa-face { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
.ffa-face svg { height: 100%; width: auto; max-width: 100%; }
.ffa-info { flex: 0 0 auto; padding: 0.3rem 0.4rem 0.4rem; display: flex; flex-direction: column; gap: 0.15rem; font-size: 0.62rem; letter-spacing: 0.06em; border-top: 1px dashed var(--phos-faint); }
.ffa-name { color: var(--dirty); font-weight: 700; letter-spacing: 0.12em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ffa-name b { font-size: 0.55rem; letter-spacing: 0.08em; }
.ffa-cards { display: flex; flex-wrap: wrap; gap: 0.3rem; min-height: 1.5rem; align-items: center; }
.ffa-hand { display: inline-flex; gap: 2px; align-items: center; }
.ffa-hand em { font-style: normal; margin-left: 3px; color: var(--phos); }
.ffa-hand sub { font-size: 0.5rem; color: var(--phos-dim); }
.ffa-hand.busted .mc { opacity: 0.55; }
.mc {
  display: inline-flex; align-items: center; justify-content: center; gap: 1px;
  min-width: 1.35rem; height: 1.6rem; padding: 0 2px; border-radius: 3px;
  background: var(--card); color: var(--card-ink); font-size: 0.62rem; font-weight: 700; text-shadow: none;
}
.mc i { font-style: normal; font-size: 0.6rem; }
.mc.red { color: var(--card-red); }
.mc.wild { background: #b9c6b2; color: var(--green); }
.mc.back { background: repeating-linear-gradient(45deg, #3d1f1c 0 3px, #29130f 3px 6px); border: 1px solid #5e2722; }
.mc.xr { box-shadow: 0 0 0 1px var(--phos), 0 0 8px rgba(168, 201, 160, 0.6); }
.ffa-status { color: var(--amber); min-height: 0.9rem; letter-spacing: 0.14em; }
.ffa-intel { color: var(--phos); }

@media (max-width: 980px), (max-height: 520px) {
  #mon5.ffa-mode { height: 62vh; min-height: 420px; max-height: 640px; }
}
@media (max-width: 640px) {
  .mp-grid { grid-template-columns: minmax(0, 1fr); }
  .ffa-grid.n3 { grid-template-columns: 1fr; }
  .ffa-face { height: 90px; flex: 0 0 auto; }
  .mp-join { grid-template-columns: minmax(0, 1fr) auto; }
  .mp-join .mp-label { grid-column: 1 / -1; }
}

</style>

<body class="fx-full">
<!-- HOUSE OF 21 — runs fully offline. No external requests, no modules, no installs. -->
<div id="app">

  <!-- =============================== THE ROOM =============================== -->
  <main id="room" class="room" aria-label="Game table">
    <!-- Layer 1: basement background -->
    <div id="layerBg" class="layer layer-bg" aria-hidden="true">
      <div class="wall"></div>
      <div class="pipe pipe-h p1"></div>
      <div class="pipe pipe-h p2"></div>
      <div class="pipe pipe-v p3"></div>
      <div class="pipe pipe-v p4"></div>
      <div class="jbox jb1"><span></span><span></span></div>
      <div class="jbox jb2"><span></span></div>
      <div class="bulb-cord"></div>
      <div class="bulb"></div>
      <div class="bulb-glow"></div>
      <div class="floor"></div>
    </div>

    <!-- Layer 2: monitor frames (each monitor's screen content is layer 3) -->
    <div id="layerFrames" class="layer layer-frames">
      <div class="console" id="console">

        <!-- MONITOR 1 — PLAYER STATUS (top left) -->
        <section class="monitor" id="mon1" aria-label="Player status">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>PLAYER STATUS</span><span class="led"></span></header>
              <div class="scr-body" id="livesBody"></div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;01</div>
          </div>
        </section>

        <!-- MONITOR 2 — INVENTORY (bottom left) -->
        <section class="monitor" id="mon2" aria-label="Inventory">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>INVENTORY</span><span class="scr-sub" id="invCount">0/5</span></header>
              <div class="scr-body" id="invBody"></div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;02</div>
          </div>
        </section>

        <!-- CENTER STACK -->
        <div class="center-stack">
          <!-- MONITOR 5 — OPPONENT (main center) -->
          <section class="monitor monitor-main" id="mon5" aria-label="Opponent">
            <div class="bezel">
              <div class="screen"><div class="screen-inner">
                <header class="scr-head opp-head">
                  <span id="oppName">—</span>
                  <span class="opp-lives" id="oppLivesTop"></span>
                </header>
                <div class="scr-body opp-stage" id="oppStage">
                  <div class="opp-face" id="oppFace"></div>
                  <div class="opp-speech" id="oppSpeech" aria-live="polite"></div>
                  <div class="opp-cards" id="oppCards"></div>
                  <div class="m5-overlay" id="m5Overlay" hidden></div>
                </div>
              </div><div class="scanlines"></div><div class="glare"></div></div>
              <div class="bezel-tag">MON&#8209;05 · LIVE FEED</div>
            </div>
          </section>

          <!-- MONITOR 6 — OPPONENT LOG (small center) -->
          <section class="monitor monitor-log" id="mon6" aria-label="Opponent log">
            <div class="bezel">
              <div class="screen"><div class="screen-inner">
                <header class="scr-head"><span>OPPONENT LOG</span><span class="scr-sub" id="logStatus">STANDBY</span></header>
                <div class="scr-body log-body">
                  <ol class="log-list" id="logList" aria-live="polite"></ol>
                  <div class="log-footer" id="logFooter"></div>
                </div>
              </div><div class="scanlines"></div><div class="glare"></div></div>
              <div class="bezel-tag">MON&#8209;06</div>
            </div>
          </section>
        </div>

        <!-- MONITOR 3 — PLAYER HAND (top right) -->
        <section class="monitor" id="mon3" aria-label="Your hand">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>YOUR HAND</span><span class="scr-sub" id="handTotalTop"></span></header>
              <div class="scr-body" id="handBody"></div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;03</div>
          </div>
        </section>

        <!-- MONITOR 4 — PLAYER ACTIONS (bottom right) -->
        <section class="monitor" id="mon4" aria-label="Actions">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>ACTIONS</span><span class="scr-sub" id="turnTag">—</span></header>
              <div class="scr-body actions-body">
                <div class="act-status" id="actStatus">STANDBY</div>
                <div class="act-grid">
                  <button class="key" id="btnHit" data-act="hit" data-tip="HIT [H] — draw another card.">HIT</button>
                  <button class="key" id="btnStand" data-act="stand" data-tip="STAND [S] — lock your current hand.">STAND</button>
                  <button class="key" id="btnDouble" data-act="double" data-tip="DOUBLE DOWN [D] — draw exactly one card and stand. The round costs 2 lives either way. Only on your first two cards.">DOUBLE<br>DOWN</button>
                  <button class="key" id="btnSplit" data-act="split" data-tip="SPLIT [P] — your first two cards share a value: play them as two hands. Your best hand counts.">SPLIT</button>
                  <button class="key key-wide" id="btnItem" data-act="item" data-tip="USE ITEM [I] — open your inventory.">USE ITEM</button>
                </div>
                <button class="key key-primary" id="btnPrimary" hidden>DEAL</button>
              </div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;04</div>
          </div>
        </section>

      </div>
    </div>

    <!-- Layer 4: foreground cables and shadows -->
    <div id="layerFg" class="layer layer-fg" aria-hidden="true">
      <svg class="fg-cables" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <path d="M-20 820 C 160 760, 240 900, 420 930" fill="none" stroke="#050505" stroke-width="18" stroke-linecap="round"/>
        <path d="M-20 860 C 120 820, 260 940, 360 960" fill="none" stroke="#0b0b0a" stroke-width="10" stroke-linecap="round"/>
        <path d="M1460 780 C 1280 760, 1240 880, 1060 940" fill="none" stroke="#060606" stroke-width="16" stroke-linecap="round"/>
        <path d="M1460 40 C 1360 30, 1340 -10, 1280 -30" fill="none" stroke="#070707" stroke-width="12" stroke-linecap="round"/>
      </svg>
      <div class="vignette"></div>
      <div class="dread"></div>
    </div>

    <div class="banner" id="banner" aria-live="polite"></div>
  </main>

  <!-- ============================ FULL SCREENS ============================ -->
  <section class="screen-full" id="scrTitle" aria-label="Title">
    <div class="title-wrap">
      <div class="title-kicker">AN UNDERGROUND TOURNAMENT · 3 COMPETITORS · 3 LIVES</div>
      <h1 class="title-logo">HOUSE<span>OF</span>21</h1>
      <div class="title-menu">
        <button class="key key-menu" id="tContinue" hidden>CONTINUE</button>
        <button class="key key-menu" id="tNew">NEW GAME</button>
        <button class="key key-menu" id="tMulti">MULTIPLAYER</button>
        <button class="key key-menu" id="tHow">HOW TO PLAY</button>
        <button class="key key-menu" id="tCredits">CREDITS</button>
      </div>
      <div class="title-settings">
        <button class="key key-small" id="tSound">SOUND: ON</button>
        <button class="key key-small" id="tFx">EFFECTS: FULL</button>
      </div>
      <p class="title-note">Fictional tokens only. No real money. Works offline.</p>
    </div>
  </section>

  <section class="screen-full" id="scrStory" hidden aria-label="Story">
    <div class="story-wrap">
      <div class="story-portrait" id="storyPortrait"></div>
      <div class="story-panel">
        <div class="story-tag" id="storyTag"></div>
        <p class="story-text" id="storyText"></p>
        <div class="story-controls">
          <button class="key key-small" id="storySkip">SKIP</button>
          <button class="key key-primary" id="storyNext">CONTINUE ▸</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen-full" id="scrInfo" hidden aria-label="Information">
    <div class="info-wrap">
      <h2 class="info-title" id="infoTitle">HOW TO PLAY</h2>
      <div class="info-body" id="infoBody"></div>
      <button class="key key-primary" id="infoBack">BACK</button>
    </div>
  </section>

  <section class="screen-full" id="scrMulti" hidden aria-label="Multiplayer">
    <div class="multi-wrap" id="multiBody" data-stage=""></div>
  </section>

  <section class="screen-full" id="scrResult" hidden aria-label="Result">
    <div class="result-wrap">
      <div class="result-kicker" id="resultKicker"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="result-portrait" id="resultPortrait"></div>
      <p class="result-sub" id="resultSub"></p>
      <div class="result-actions">
        <button class="key key-primary" id="resultBtn">CONTINUE</button>
        <button class="key" id="resultBtn2" hidden>TITLE</button>
      </div>
    </div>
  </section>

  <!-- Menu button (in-game) -->
  <button class="menu-btn" id="menuBtn" hidden aria-label="Menu" data-tip="MENU [Esc]">≡</button>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <canvas id="staticCanvas" class="static-canvas" aria-hidden="true"></canvas>
</div>

<script>
/* ---- config.js ---- */
/* ==========================================================================
   HOUSE OF 21 — config.js
   Every tunable rule lives here so designers can rebalance without touching
   game logic. Classic script (no ES modules) so the game runs from file://
   on Chromebooks and offline.
   ========================================================================== */
(function (H) {
  'use strict';

  H.CONFIG = {
    // ---- Lives -----------------------------------------------------------
    startingLives: 3,          // both participants at the start of each match
    maxLives: 4,               // cap that LEFTOVERS can raise lives to

    // ---- Tournament ------------------------------------------------------
    matches: 3,                // competitors to defeat

    // ---- Inventory -------------------------------------------------------
    inventoryMax: 5,
    itemsPerMatch: 3,          // incoming items at the start of every match
    maxSealedItems: 3,         // ZIPLOCK BAG can hold at most this many

    // ---- Tokens / shop (fictional currency, no real money) ---------------
    startingTokens: 0,
    tokensPerWin: 1,
    shopSize: 3,
    shopPrice: 2,
    shopPurchasesPerIntermission: 1,

    // ---- Round penalties -------------------------------------------------
    basePenalty: 1,
    doubleDownPenalty: 2,
    handSawPenalty: 2,
    maxRoundPenalty: 2,        // a round result never costs more than this

    // ---- Item tuning -----------------------------------------------------
    xrayDurationMs: 5000,
    burnerThreshold: 15,
    placeboMin: 1,
    placeboMax: 5,
    guillotineMin: 1,
    guillotineMax: 5,
    allowBustRescue: true,     // offer REWIND / GAS / GUILLOTINE when you bust

    // ---- Pacing ----------------------------------------------------------
    opponentThinkMs: [750, 1350],
    dealStepMs: 260,
    revealHoldMs: 2400,
    maxActionsPerRound: 60,    // safety valve: forces both sides to stand

    // ---- Item rarity -----------------------------------------------------
    // weight = relative chance of each item of that tier being rolled.
    // color  = the tier colour used everywhere in the UI.
    rarities: {
      common:     { name: 'COMMON',     color: '#ece8dc', weight: 10 },
      uncommon:   { name: 'UNCOMMON',   color: '#8f938d', weight: 6 },
      rare:       { name: 'RARE',       color: '#e38a7e', weight: 3 },
      veryrare:   { name: 'VERY RARE',  color: '#a3342a', weight: 1.2 },
      contraband: { name: 'CONTRABAND', color: '#000000', weight: 0.4 }
    },
    rarityOrder: ['common', 'uncommon', 'rare', 'veryrare', 'contraband'],

    // ---- New item tuning -------------------------------------------------
    fluShotRounds: 3,
    russianDollMin: 1,
    russianDollMax: 10,
    pandoraChoices: 3,

    // ---- Competitors -----------------------------------------------------
    // One competitor per match is drawn from each tier (easier first).
    lineupTiers: [
      ['betty', 'bob', 'dennis', 'cassie', 'mark'],
      ['bryan', 'elaine', 'chuck', 'luisa', 'phil'],
      ['jack', 'sandra', 'hugo', 'twins']
    ],
    conductorChance: 0.000001,   // per match: one in a million
    sandraStealChance: 0.3,      // per Sandra turn, at most once per round

    // ---- Online multiplayer ----------------------------------------------
    mp: {
      startLives: 3, maxLives: 4, startItems: 3, inventoryMax: 5,
      turnMs: 30000,      // a turn left idle this long auto-stands
      askMs: 20000,       // time to answer a prompt (Dead Weight, mystery card)
      rescueMs: 15000,    // time to save a bust with an item
      interMs: 25000,     // break between rounds (shop open)
      revealMs: 4000,     // how long the round result stays on screen
      gatherMs: 15000,    // public match: wait this long for everyone to arrive
      shopSize: 3, shopPrice: 2, tokensPerWin: 1,
      logWindow: 8,       // log lines carried in each table update
      wireLimit: 3600     // bytes; the shared table must fit the 4 KiB presence
    },

    // ---- Storage ---------------------------------------------------------
    saveKey: 'house21.save.v1',

/* ---- cards.js ---- */
/* ==========================================================================
   HOUSE OF 21 — cards.js

   Pure logic: no DOM access.
   ========================================================================== */
(function (H) {
  'use strict';

  var SUITS = [
    { key: 'S', sym: '♠', name: 'Spades', red: false },
    { key: 'H', sym: '♥', name: 'Hearts', red: true },
    { key: 'D', sym: '♦', name: 'Diamonds', red: true },
    { key: 'C', sym: '♣', name: 'Clubs', red: false }

  var RANK_NAMES = { A: 'Ace', J: 'Jack', Q: 'Queen', K: 'King' };

  var RNG = {
    next: function () {

  function handValue(cards) {
    var total = 0, soft = 0;
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (c.mystery) continue; // SCHRODINGER'S CARD: sealed until the round ends
      if (isFlexibleAce(c)) { total += 11; soft += 1; } else { total += cardValue(c); }

  }

    if (cards.length !== 2) return false;
    for (var i = 0; i < 2; i++) if (cards[i].wild || cards[i].mod !== null) return false;
    return handValue(cards).total === 21;
  }

  /** Probability that one more card from `pool` busts this hand. */
  function bustProbability(cards, pool) {

  function rankLabel(card) { return card.wild ? (card.kind === 'doll' ? 'D' : 'W') : card.rank; }
  function label(card) {

    if (card.wild) return 'Counts as ' + card.mod + '.';
    if (card.mod !== null) return 'Fixed value ' + card.mod + '.';

    RANKS: RANKS,

    makeCard: makeCard,
    makeWild: makeWild,
    baseValue: baseValue,
    cardValue: cardValue,
    handValue: handValue,

        var wasFull = mine.length + 1 >= C().inventoryMax;

          back.offer = null;
          theirs.push(back);
          say(E, who, 'GLOVES: HANDS FULL · YOU GAVE THEM ' + ITEMS[back.id].name, 'GLOVES: HANDS FULL · THEY GAVE YOU ' + ITEMS[back.id].name);

  function costsOf(it, params) {
    return typeof it.costsAction === 'function' ? !!it.costsAction(params || {}) : !!it.costsAction;

  /* Weighted drops ---------------------------------------------------------
     opts: ai (skip aiExclude), pool (ids), tiers (rarity keys),
           window (must be usable then), exclude (ids), distinct (no repeats) */
  function candidates(opts) {
    return ALL_IDS.filter(function (id) {
      var it = ITEMS[id];
      if (opts.ai && it.aiExclude) return false;
      if (opts.pool && opts.pool.indexOf(id) < 0) return false;
      if (opts.tiers && opts.tiers.indexOf(it.rarity) < 0) return false;
      if (opts.window && it.windows.indexOf(opts.window) < 0) return false;
      if (opts.exclude && opts.exclude.indexOf(id) >= 0) return false;
      return true;
    });
  }
  function weightOf(id) {
    var r = C().rarities[ITEMS[id].rarity];
    return r ? r.weight : 1;
  }
  function pickWeighted(cands) {
    var total = 0, i;
    for (i = 0; i < cands.length; i++) total += weightOf(cands[i]);
    var roll = H.RNG.next() * total;
    for (i = 0; i < cands.length; i++) {
      roll -= weightOf(cands[i]);
      if (roll < 0) return cands[i];
    }
    return cands[cands.length - 1];
  }
  function randomIds(n, opts) {
    if (typeof opts === 'boolean') opts = { ai: opts };
    opts = opts || {};
    var cands = candidates(opts), out = [];
    for (var i = 0; i < n && cands.length; i++) {
      var id = pickWeighted(cands);
      out.push(id);
      if (opts.distinct) cands = cands.filter(function (x) { return x !== id; });
    }
    return out;
  }
  function withTag(tag) { return ALL_IDS.filter(function (id) { return ITEMS[id].tags.indexOf(tag) >= 0; }); }
  function rarityOf(id) { return C().rarities[ITEMS[id].rarity]; }
  function byRarity(a, b) {
    var o = C().rarityOrder;
    return o.indexOf(ITEMS[a].rarity) - o.indexOf(ITEMS[b].rarity);
  }

  H.Items = {
    ITEMS: ITEMS,
    ALL_IDS: ALL_IDS,
    get: function (id) { return ITEMS[id]; },
    icon: icon,
    randomIds: randomIds,
    withTag: withTag,
    rarityOf: rarityOf,
    byRarity: byRarity,
    costsOf: costsOf,
    findCardIndex: findCardIndex,
    lastDrawnReal: lastDrawnReal,
    isReal: isReal
  };
})(window.H21 = window.H21 || {});

  function byId(id) {
    for (var i = 0; i < OPPONENTS.length; i++) if (OPPONENTS[i].id === id) return OPPONENTS[i];
    return OPPONENTS[0];
  }

  /* ------------------------------------------------------------------ */
  /* Reading the table                                                   */
  /* ------------------------------------------------------------------ */
  function estimatePlayer(E, def) {
    if (def && def.traits.allSeeing) {
      var b = E.bestTotal('player');
      return b > 21 ? 0 : b;
    }
    var intel = E.side('opp').intel;
    var pc = E.cardCount('player');
    var est;
    if (intel.xray) {
      est = Cards.handValue(intel.xray).total + Math.max(0, pc - intel.xray.length) * 5;
    } else {
      est = 16 + (E.isDone('player') ? 2 : 0) + (pc >= 3 ? 1 : 0);
    }
    if (E.side('player').doubled) est = Math.max(est, 18);
    if (intel.burner && intel.burnerCount === pc) {
      if (intel.burner === 'BELOW') est = Math.min(est, 14);
      else if (intel.burner === 'EXACTLY') est = 15;
      else est = Math.max(est, 18);
    }
    return Math.max(4, Math.min(21, est));
  }

  function shouldSplit(hand, ai) {
    if (hand.cards.length !== 2 || hand.cards[0].rank !== hand.cards[1].rank) return false;
    return ai.splitRanks.indexOf(hand.cards[0].rank) >= 0;
  }

  /* ------------------------------------------------------------------ */
  /* Main action: hit / stand / double / split                            */
  /* ------------------------------------------------------------------ */
  function decideAction(E, def) {
    var ai = def.ai;
    var s = E.side('opp');
    var h = E.focusHand('opp');
    var hv = Cards.handValue(h.cards), t = hv.total;
    var acts = E.availableActions('opp', false);
    function can(a) { return acts.indexOf(a) >= 0; }

    if (t >= 21) return 'stand';
    if (E.cardCount('opp') >= 11) return 'stand';
    if (ai.style === 'threshold') return (t < ai.standMin && can('hit')) ? 'hit' : 'stand';
    if (can('split') && shouldSplit(h, ai)) return 'split';
    var rage = E.rage();
    var dChance = ai.doubleChance + (ai.style === 'impatient' ? rage * 0.4 : 0);
    if (can('double') && ai.doubleTotals.indexOf(t) >= 0 && RNG.chance(dChance)) return 'double';
    if (!can('hit')) return 'stand';

    var pool = E.unknownPool('opp');
    var pb = Cards.bustProbability(h.cards, pool);
    var est = estimatePlayer(E, def);
    var playerDone = E.isDone('player');
    var target = s.aiTarget || ai.standMin;
    var hit = false;

    switch (ai.style) {
      case 'cautious':
        if (hv.soft && t <= ai.softHitMax) hit = true;
        else if (t <= 11) hit = true;
        else if (t < target) hit = pb <= ai.maxBustRisk || (playerDone && est > t);
        else if (playerDone && est > t && pb < 0.6) hit = true;
        break;
      case 'aggressive':
        if (hv.soft && t <= ai.softHitMax) hit = true;
        else if (t < target) hit = true;
        else if (t <= 19 && RNG.chance(ai.reckless)) hit = true;
        else if (t === 20 && RNG.chance(0.04)) hit = true;
        if (hit && t >= 12 && t <= 16 && RNG.chance(ai.chaos)) hit = false;
        break;
      case 'calculated':
        if (t <= 11) hit = true;
        else if (hv.soft && t <= ai.softHitMax) hit = true;
        else if (playerDone) {
          if (t > est) hit = false;
          else if (t < est) hit = pb < 0.85;
          else hit = pb < 0.4;
        } else {
          hit = pb < ai.riskBase + (est >= 19 ? 0.1 : 0) - (t >= 17 ? 0.15 : 0);
        }
        if (t >= 13 && t <= 17 && RNG.chance(ai.chaos)) hit = !hit;
        break;
      case 'impatient':
        hit = t < 17 || (hv.soft && t <= 18) || (t <= 19 && RNG.chance(0.08 + rage * 0.45));
        if (playerDone && est > t && pb < 0.8) hit = true;
        break;
      case 'bad-timid':
        if (t <= 11) hit = RNG.chance(0.85);
        else if (t <= 16) hit = RNG.chance(0.35);
        else if (t <= 19) hit = RNG.chance(0.2);
        else hit = RNG.chance(0.04);
        break;
      case 'bad-greedy':
        if (t <= 18) hit = RNG.chance(0.95);
        else if (t === 19) hit = RNG.chance(0.45);
        else hit = RNG.chance(0.1);
        break;
      case 'house': {
        var p = estimatePlayer(E, def);
        if (E.allBusted('player')) hit = false;
        else if (playerDone) {
          if (t > p) hit = false;
          else if (t < p) hit = true;
          else hit = pb < 0.3;
        } else {
          hit = t < 17 || (hv.soft && t <= 17) || (p > t && pb < 0.55);
        }
        break;
      }
      default: // standard
        hit = (hv.soft && t <= ai.softHitMax) || t < target || (playerDone && est > t && pb < 0.6);
    }
    return hit ? 'hit' : 'stand';
  }

  /* ------------------------------------------------------------------ */
  /* Items during a turn                                                 */
  /* ------------------------------------------------------------------ */
  function allowed(def, id) {
    return !(def.items && def.items.onlyPool && def.items.pool.indexOf(id) < 0);
  }

  function scoreItem(id, E, ctx, def) {
    if (ITEMS[id].hostile && E.immune('player')) return 0;
    switch (id) {
      case 'leftovers': return ctx.lives < E.startLives() ? 0.9 : 0.25;
      case 'contraband': {
        var prev = E.side('opp').prevInitial;
        if (!prev) return 0;
        var pt = Cards.handValue(prev).total;
        return (pt >= 17 && pt > ctx.t + 1 && ctx.t < 17) ? 0.85 : 0;
      }
      case 'deadweight':
        if (ctx.t <= 11) return 0.55;
        if (ctx.playerDone && ctx.t <= 16) return 0.45;
        return 0.08;
      case 'xray': return (!ctx.intel.xray && !ctx.playerDone) ? 0.45 : 0.05;
      case 'burner': return ((!ctx.intel.burner || ctx.intel.burnerCount !== ctx.pc) && ctx.pc >= 3) ? 0.5 : 0.12;
      case 'ratpoison': return E.inventory('player').length >= 2 ? 0.55 : 0.35;
      case 'shackles': return ctx.playerDone ? 0 : (ctx.pc === 2 ? 0.6 : 0.45);
      case 'handsaw': return ctx.playerDone ? 0.1 : (ctx.pc >= 3 ? 0.65 : 0.35);
      case 'rewind': return (ctx.t >= 12 && ctx.t <= 16) ? 0.35 : 0;
      case 'placebo': {
        var need = 21 - ctx.t;
        if (need >= 1 && need <= 5) return 0.95;
        return ctx.t <= 11 ? 0.1 : 0;
      }
      case 'viceclamp': return ctx.playerDone ? 0.15 : (E.inventory('player').length >= 2 ? 0.55 : 0.3);
      case 'chokehold': return ctx.playerDone ? (ctx.est >= ctx.t ? 0.6 : 0.2) : 0.15;
      case 'flushot': return E.inventory('player').length >= 2 ? 0.5 : 0.2;
      case 'russiandoll': { var nd = 21 - ctx.t; return (ctx.t >= 11 && nd >= 1 && nd <= 10) ? 0.45 : 0.1; }
      case 'coinflip': return ctx.lives <= 1 ? (def.traits.gambler ? 0.4 : 0.02) : 0.3;
      case 'pandora': return 0.6;
      case 'schrodinger': return ctx.t <= 11 ? 0.55 : (ctx.t <= 14 ? 0.3 : 0.1);
      case 'gloves': return E.inventory('player').length ? 0.5 : 0;
      default: return 0;
    }
  }

  function bestRemoval(cards) {
    var known = cards.filter(function (c) { return !c.mystery; });
    var bestUid = null, bestT = -1;
    known.forEach(function (c) {
      var rest = cards.filter(function (x) { return x.uid !== c.uid; });
      var nt = Cards.handValue(rest).total;
      if (nt <= 21 && nt > bestT) { bestT = nt; bestUid = c.uid; }
    });
    return bestUid || (known[0] && known[0].uid);
  }
  function biggestCard(cards) {
    var b = null;
    cards.forEach(function (c) {
      if (c.mystery || Cards.cardValue(c) <= 1) return;
      if (!b || Cards.cardValue(c) > Cards.cardValue(b)) b = c;
    });
    return b;
  }

  function paramsFor(id, E, ctx, def) {
    var h = E.focusHand('opp');
    if (id === 'placebo') {
      var need = 21 - ctx.t;
      return { value: (need >= 1 && need <= 5) ? need : 5 };
    }
    if (id === 'russiandoll') {
      return { value: Math.max(H.CONFIG.russianDollMin, Math.min(H.CONFIG.russianDollMax, 21 - ctx.t)) };
    }
    if (id === 'gas') { var u = bestRemoval(h.cards); return u ? { cardUid: u } : null; }
    if (id === 'guillotine') { var b = biggestCard(h.cards); return b ? { cardUid: b.uid } : null; }
    if (id === 'pandora') {
      var offers = E.rollOffer('turn', true), best = null, bs = -1;
      offers.forEach(function (oid) {
        if (!E.virtualCanUse('opp', oid, 'turn').ok) return;
        var sc = scoreItem(oid, E, ctx, def) + RNG.next() * 0.1;
        if (sc > bs) { bs = sc; best = oid; }
      });
      if (!best) return null;
      var inner = paramsFor(best, E, ctx, def);
      return inner === null ? null : { choice: best, inner: inner };
    }
    return {};
  }

  function decideItem(E, def) {
    var s = E.side('opp');
    var inv = E.inventory('opp');
    if (!inv.length) { s.spree = false; return null; }
    var hoarder = def.traits.hoarder;
    if (hoarder) {
      if (inv.length >= H.CONFIG.inventoryMax || E.lives('opp') <= 1) s.spree = true;
      if (!s.spree) return null;
    } else if (s.itemsUsedThisRound >= def.ai.maxItemsPerRound) return null;

    var h = E.focusHand('opp');
    var ctx = {
      t: Cards.handValue(h.cards).total,
      pc: E.cardCount('player'),
      playerDone: E.isDone('player'),
      lives: E.lives('opp'),
      intel: s.intel,
      est: estimatePlayer(E, def)
    };
    var best = null, bestScore = 0;
    inv.forEach(function (it) {
      if (!allowed(def, it.id)) return;
      if (!E.canUseItem('opp', it.uid, 'turn').ok) return;
      var sc = def.ai.randomItems ? RNG.next()
        : scoreItem(it.id, E, ctx, def) * (def.ai.itemWeights[it.id] || 1) + RNG.next() * 0.15;
      if (hoarder && s.spree) sc += 1;
      if (sc > bestScore) { bestScore = sc; best = it; }
    });
    if (!best) return null;
    if (!(hoarder && s.spree)) {
      if (bestScore < def.ai.itemThreshold) return null;
      if (!RNG.chance(def.ai.itemChance)) return null;
    }
    var params = paramsFor(best.id, E, ctx, def);
    if (params === null) return null;
    return { uid: best.uid, id: best.id, params: params };
  }

  /* Between rounds: healing, tourniquet, flu shot, coin flips. */
  function decidePrep(E, def) {
    var out = [], taken = [];
    var inv = E.inventory('opp');
    var lives = E.lives('opp');
    var tr = def.traits;
    if (tr.hoarder && !E.side('opp').spree && lives > 1) return out;
    function usable(id) {
      if (!allowed(def, id)) return null;
      for (var i = 0; i < inv.length; i++) {
        if (inv[i].id === id && taken.indexOf(inv[i].uid) < 0 && E.canUseItem('opp', inv[i].uid, 'between').ok) return inv[i];
      }
      return null;
    }
