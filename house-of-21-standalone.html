    }
    var rank = Cards.rankLabel(card);
    var mod = card.mod !== null && !card.wild ? '<span class="modtag">=' + card.mod + '</span>' : '';
    var cls = 'card' + (card.red ? ' red' : '') + (card.wild ? ' wild' : '') + (card.kind === 'doll' ? ' doll' : '') + (card.smuggled ? ' smuggled' : '') + (card.mod !== null && !card.wild ? ' cut' : '') + anim + extra;
    var mid = card.wild ? card.mod : card.sym;
    return '<div class="' + cls + '" tabindex="0" data-tip="' + esc(Cards.fullName(card) + ' — ' + Cards.describeValue(card)) + '">' +
      '<span class="c-tl">' + rank + '<i>' + (card.wild ? '✱' : card.sym) + '</i></span>' +
      '<span class="c-mid">' + mid + '</span>' +
      '<span class="c-br">' + rank + '</span>' + mod +
      '</div>';
  }
  function backHTML(uid, extra) {
    var anim = '';
    var key = 'b' + uid;
    if (!seen[key]) { seen[key] = true; anim = ' deal-in'; }
    return '<div class="card back' + anim + (extra || '') + '"><span class="back-mark">21</span></div>';
  }

  /* ======================================================================
     RENDER
     ====================================================================== */
  function render(v) {
    lastView = v;
    document.body.classList.toggle('critical', v.dread >= 1);
    document.body.classList.toggle('uneasy', v.dread > 0 && v.dread < 1);
    if (!v.hands.length && !v.opp.hands.length) seen = {};
    renderLives(v);
    renderInventory(v);
    renderHand(v);
    renderActions(v);
    renderOpponent(v);
    renderLog(v);
  }

  function renderLives(v) {
    var n = v.lives.player;
    var slots = Math.max(v.startingLives, n);
    var dropped = lastLives.player !== null && n < lastLives.player;
    var html = '<div class="lives-row" aria-label="Lives ' + n + '">' + heartsHTML(n, slots) + '</div>' +
      '<dl class="stat-grid">' +
        '<dt>LIVES</dt><dd>' + n + ' / ' + v.startingLives + (n > v.startingLives ? ' +' + (n - v.startingLives) : '') + '</dd>' +
        '<dt>ROUND</dt><dd>' + pad(Math.max(v.round, 0)) + '</dd>' +
        '<dt>MATCH</dt><dd>' + (v.matchLabel || (pad(v.match) + ' / ' + pad(v.matches))) + '</dd>' +
        '<dt>TOKENS</dt><dd class="amber">◆ ' + v.tokens + '</dd>' +
      '</dl>';
    if (v.effects.length) {
      html += '<ul class="effects">' + v.effects.map(function (e) { return '<li class="fx-' + e.k + '">' + esc(e.t) + '</li>'; }).join('') + '</ul>';
    } else if (n <= 1) {
      html += '<p class="warn-line">WARNING: ONE LIFE REMAINING</p>';
    }
    el.livesBody.innerHTML = html;
    if (dropped) {
      var lost = el.livesBody.querySelectorAll('.life.off');
      for (var i = 0; i < lost.length; i++) {
        var idx = parseInt(lost[i].getAttribute('data-i'), 10);
        if (idx >= n && idx < lastLives.player) lost[i].classList.add('just-off');
      }
    }
    lastLives.player = n;
  }

  function renderInventory(v) {
    el.invCount.textContent = v.inventory.length + '/' + v.invMax;
    var html = '<div class="inv-grid">';
    for (var i = 0; i < v.invMax; i++) {
      var it = v.inventory[i];
      if (it) {
        var rk = rarityKey(it.item);
        html += '<button class="slot r-' + rk + (it.usable ? ' usable' : '') + '" data-uid="' + it.uid + '" ' +
          'data-tip="' + esc(it.item.name + ' (' + H.CONFIG.rarities[rk].name + ') — ' + it.item.desc + (it.usable ? ' [USABLE NOW]' : ' [' + it.reason + ']')) + '" aria-label="' + esc(it.item.name + ', ' + H.CONFIG.rarities[rk].name) + '">' +
          '<span class="slot-key">' + (i + 1) + '</span>' + it.item.icon +
          '<span class="slot-name">' + esc(it.item.name) + '</span><span class="slot-rar">' + H.CONFIG.rarities[rk].name + '</span></button>';
      } else {
        html += '<div class="slot empty" aria-hidden="true"><span class="slot-key">' + (i + 1) + '</span><span class="slot-name">EMPTY</span></div>';
      }
    }
    var usableCount = v.inventory.filter(function (x) { return x.usable; }).length;
    html += '<div class="inv-hint">' + (v.inventory.length ? (usableCount ? usableCount + ' USABLE NOW<br>CLICK TO INSPECT' : 'CLICK AN ITEM<br>TO INSPECT') : 'NO ITEMS<br>WIN ROUNDS FOR TOKENS') + '</div>';
    html += '</div>';
    el.invBody.innerHTML = html;
  }

  function renderHand(v) {
    if (!v.hands.length) {
      el.handBody.innerHTML = '<div class="hand-empty">' + (v.phase === 'prep' ? 'AWAITING DEAL' : 'NO CARDS') + '</div>';
      el.handTotalTop.textContent = '';
      return;
    }
    var html = '<div class="hands' + (v.hands.length > 1 ? ' split' : ' single') + '">';
    v.hands.forEach(function (h, i) {
      var active = v.activeHand === i;
      var badge = h.bust ? '<b class="tag bad">BUST</b>' : h.natural ? '<b class="tag good">BLACKJACK</b>' : h.stood ? '<b class="tag">STOOD</b>' : '';
      var many = h.cards.length >= 6 ? ' many' : h.cards.length >= 5 ? ' some' : '';
      html += '<div class="hand' + (active ? ' active' : '') + (h.bust ? ' busted' : '') + '">' +
        (v.hands.length > 1 ? '<div class="hand-label">HAND ' + (i + 1) + (active ? ' ◀ PLAYING' : '') + '</div>' : '') +
        '<div class="hand-cards' + many + '">' + h.cards.map(function (c) { return cardHTML(c); }).join('') + '</div>' +
        '<div class="hand-total"><span class="tot-num">' + h.total + (h.mystery ? '<small> + ?</small>' : '') + '</span>' + (h.soft && !h.bust ? '<span class="soft">SOFT</span>' : '') + badge + '</div>' +
        '</div>';
    });
    html += '</div>';
    if (v.doubled) html += '<div class="hand-note">DOUBLED DOWN · ROUND COSTS 2</div>';
    el.handBody.innerHTML = html;
    var fh = v.hands[v.activeHand >= 0 ? v.activeHand : 0];
    el.handTotalTop.textContent = 'TOTAL ' + fh.total + (fh.mystery ? ' + ?' : '') + (fh.bust ? ' · BUST' : '');
  }

  function setBtn(b, s) {
    b.disabled = !s.enabled;
    b.classList.toggle('shackled', !!s.shackled);
  }

  function renderActions(v) {
    setBtn(el.btnHit, v.buttons.hit);
    setBtn(el.btnStand, v.buttons.stand);
    setBtn(el.btnDouble, v.buttons.double);
    setBtn(el.btnSplit, v.buttons.split);
    setBtn(el.btnItem, v.buttons.item);
    el.actStatus.textContent = v.status;
    el.actStatus.classList.toggle('my-turn', v.myTurn);
    el.turnTag.textContent = v.turnTag;
    if (v.primary) {

      el.btnPrimary.disabled = !!v.primaryBusy;
    } else {
      el.btnPrimary.hidden = true;

    el.mon4.classList.toggle('your-turn', v.myTurn);

  function renderOpponent(v) {
    var o = v.opp;
    el.oppName.textContent = o.def.name + ' · ' + o.def.alias;
    var dropped = lastLives.opp !== null && v.lives.opp < lastLives.opp && currentOppId === o.def.id;
    el.oppLivesTop.innerHTML = heartsHTML(v.lives.opp, Math.max(o.startLives, v.lives.opp), 'mini');
    if (dropped) { FX.glitch(el.mon5, 260); }
    lastLives.opp = v.lives.opp;
    var fsvg = el.oppFace.querySelector('svg');
    if (fsvg && o.def.traits && o.def.traits.impatient) Face.setBlush(fsvg, o.rage);

    var html = '';
    if (!o.hands.length) {
      html = '<div class="opp-cards-empty">' + (v.phase === 'prep' ? 'NO CARDS · WAITING FOR DEAL' : '') + '</div>';
    } else {
      o.hands.forEach(function (h, hi) {
        html += '<div class="opp-hand' + (o.reveal && h.bust ? ' busted' : '') + '">';
        if (o.reveal) {
          html += h.cards.map(function (c) { return cardHTML(c, ' small revealed'); }).join('');
          html += '<span class="opp-total">' + h.total + (h.bust ? ' BUST' : '') + '</span>';
        } else {
          for (var i = 0; i < h.cards.length; i++) {
            var c = h.cards[i];
            var xr = null;
            if (o.xray) {
              for (var j = 0; j < o.xray.length; j++) if (o.xray[j].uid === c.uid) xr = o.xray[j];
            }
            if (xr) html += cardHTML(xr, ' small xrayed');
            else html += backHTML(c.uid, ' small');
          }
          html += '<span class="opp-total">' + (o.split ? 'H' + (hi + 1) + ' · ' : '') + h.count + ' CARDS</span>';
        }
        html += '</div>';
      });
      if (o.xray) html += '<div class="xray-tag">X-RAY · OPENING CARDS</div>';
    }
    el.oppCards.innerHTML = html;
  }

  var logRendered = 0;
  function renderLog(v) {
    var list = el.logList;
    if (v.log.length < logRendered || list.children.length !== logRendered) { list.innerHTML = ''; logRendered = 0; }
    var frag = document.createDocumentFragment();
    for (var i = logRendered; i < v.log.length; i++) {
      var e = v.log[i];
      var li = document.createElement('li');
      li.className = 'lg lg-' + e.who + ' lk-' + e.kind;
      li.textContent = (e.who === 'player' ? 'YOU › ' : '') + e.text;
      frag.appendChild(li);
    }
    list.appendChild(frag);
    logRendered = v.log.length;
    list.scrollTop = list.scrollHeight;

    var o = v.opp;
    if (v.footer) {
      el.logFooter.innerHTML = v.footer;
      el.logStatus.textContent = v.logStatus || o.status;
      return;
    }
    var tot = 'UNKNOWN';
    if (o.reveal && o.hands.length) tot = o.hands.map(function (h) { return h.total + (h.bust ? ' BUST' : ''); }).join(' / ');
    el.logFooter.innerHTML =
      '<span><b>LIVES</b> <em class="red">' + textHearts(v.lives.opp) + '</em></span>' +
      '<span><b>CARDS</b> ' + o.cardCount + '</span>' +
      '<span><b>ITEMS</b> ' + o.itemCount + '</span>' +
      '<span><b>TOTAL</b> ' + tot + '</span>' +
      (o.burner ? '<span><b>BURNER</b> ' + esc(o.burner) + '</span>' : '') +
      (o.shackled ? '<span class="red"><b>LOCKED</b> ' + esc(o.shackled) + '</span>' : '') +
      (o.doubled ? '<span class="amber"><b>DOUBLED</b></span>' : '');
    el.logStatus.textContent = o.status;
  }

  /* ======================================================================
     OPPONENT PORTRAIT, SPEECH, BANNERS
     ====================================================================== */
  function setOpponent(def) {
    if (currentOppId === def.id && el.oppFace.firstChild) return;
    currentOppId = def.id;
    currentDef = def;
    lastLives.opp = null;
    el.oppFace.classList.remove('eliminated');
    el.oppFace.innerHTML = Face.build(def.look) + '<div class="signal-lost">SIGNAL LOST</div>';
    Face.apply(el.oppFace.querySelector('svg'), baseExpr(def));
    el.oppName.textContent = def.name + ' · ' + def.alias;
  }

  function baseExpr(d) {
    if (!d) return 'neutral';
    if (d.traits && d.traits.stoneFace) return 'tired';
    return d.baseExpr || 'neutral';
  }

  var exprTimer = 0;
  function setExpression(name) {
    var svg = el.oppFace.querySelector('svg');
    if (!svg) return;
    Face.apply(svg, name);
    el.oppFace.classList.remove('bob');
    void el.oppFace.offsetWidth;
    el.oppFace.classList.add('bob');
    clearTimeout(exprTimer);
    if (name !== 'dead') {
      exprTimer = setTimeout(function () {
        var v = lastView;
        if (svg.getAttribute('data-expr') === 'dead') return;
        var stone = currentDef && currentDef.traits && currentDef.traits.stoneFace;
        Face.apply(svg, (v && v.lives.opp <= 1 && !stone) ? 'nervous' : baseExpr(currentDef));
      }, 3200);
    }
  }

  function oppEliminated() {
    el.oppFace.classList.add('eliminated');
    var svg = el.oppFace.querySelector('svg');
    if (svg) Face.apply(svg, 'dead');
  }

  var sayTimer = 0, sayTyping = null;
  function say(text, who) {
    if (!text) return;
    clearTimeout(sayTimer);
    if (sayTyping) sayTyping.finish();
    el.oppSpeech.className = 'opp-speech show ' + (who === 'conductor' ? 'from-conductor' : '');
    el.oppSpeech.innerHTML = '<span class="speaker">' + (who === 'conductor' ? 'THE CONDUCTOR' : esc(lastView ? lastView.opp.def.name : '')) + '</span><span class="said"></span>';
    sayTyping = typeText(el.oppSpeech.querySelector('.said'), '“' + text + '”', 22, false);
    sayTimer = setTimeout(function () { el.oppSpeech.className = 'opp-speech'; }, 3800 + text.length * 30);
  }

  var whisperTimer = 0;
  function conductorWhisper(text) {
    var band = el.conductorBand;
    FX.staticBurst(220, 0.18);
    FX.glitch(el.mon5, 200);
    band.innerHTML = '<div class="cb-portrait">' + Face.conductor() + '</div><div class="cb-text"><span class="speaker">THE CONDUCTOR</span><span class="said"></span></div>';
    band.hidden = false;
    band.classList.remove('out');
    typeText(band.querySelector('.said'), text, 26, false);
    clearTimeout(whisperTimer);
    whisperTimer = setTimeout(function () {
      band.classList.add('out');
      setTimeout(function () { band.hidden = true; }, 400);
    }, 3200 + text.length * 35);
  }

  var bannerTimer = 0;
  function banner(text, kind) {
    el.banner.textContent = text;
    el.banner.className = 'banner show ' + (kind || '');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(function () { el.banner.className = 'banner'; }, 1500);
  }

  var statusTimer = 0;
  function flashStatus(text) {
    el.actStatus.textContent = text;
    el.actStatus.classList.add('error');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      el.actStatus.classList.remove('error');
      if (lastView) el.actStatus.textContent = lastView.status;
    }, 1800);
  }

  function lifeFlash(who) {
    var target = who === 'player' ? el.mon1 : el.mon5;
    target.classList.remove('hurt-flash');
    void target.offsetWidth;
    target.classList.add('hurt-flash');
    if (who === 'player') document.body.classList.add('shake');
    setTimeout(function () { document.body.classList.remove('shake'); }, 450);
  }

  /* ======================================================================
     TYPEWRITER
     ====================================================================== */
  function typeText(node, text, speed, sound) {
    var i = 0, done = false, timer = 0, resolveFn;
    var p = new Promise(function (r) { resolveFn = r; });
    function finish() {
      if (done) return;
      done = true; clearInterval(timer);
      node.textContent = text;
      node.classList.remove('typing');
      resolveFn();
    }
    if (FX.reduced() || !speed) { node.textContent = text; done = true; resolveFn(); return { promise: p, finish: finish, isDone: function () { return true; } }; }
    node.textContent = '';
    node.classList.add('typing');
    timer = setInterval(function () {
      i += 1;
      node.textContent = text.slice(0, i);
      if (sound && text.charAt(i - 1) !== ' ') FX.sfx('type');
      if (i >= text.length) finish();
    }, speed);
    return { promise: p, finish: finish, isDone: function () { return done; } };
  }

  /* ======================================================================
     SCREENS
     ====================================================================== */
  var SCREENS = ['title', 'story', 'info', 'result', 'multi'];
  var activeScreen = 'title';
  function showScreen(name) {
    activeScreen = name;
    SCREENS.forEach(function (s) { el['scr_' + s].hidden = s !== name; });
    el.menuBtn.hidden = name !== null;
    el.room.setAttribute('aria-hidden', name !== null ? 'true' : 'false');
    if (name === 'title') updateTitleSettings();
  }

  function setTitleContinue(on) { el.tContinue.hidden = !on; }

  function updateTitleSettings() {
    el.tSound.textContent = 'SOUND: ' + (FX.settings.sound ? 'ON' : 'OFF');
    el.tFx.textContent = 'EFFECTS: ' + (FX.settings.fx === 'full' ? 'FULL' : 'LOW');
  }

  /* Story / cutscene text sequence */
  var story = null;
  function playSequence(lines) {
    showScreen('story');
    return new Promise(function (resolve) {
      var idx = -1, typing = null;
      story = {
        next: function () {
          FX.unlockAudio();
          if (typing && !typing.isDone()) { typing.finish(); return; }
          idx += 1;
          if (idx >= lines.length) { story = null; resolve(); return; }
          var ln = lines[idx];
          el.storyTag.textContent = ln.tag || (ln.who === 'conductor' ? 'THE CONDUCTOR' : '');
          el.storyPortrait.innerHTML = ln.who === 'conductor' ? Face.conductor() : '<div class="narrator-glyph"><span></span></div>';
          el.storyPortrait.className = 'story-portrait ' + (ln.who === 'conductor' ? 'is-conductor' : 'is-narrator');
          el.storyText.className = 'story-text ' + (ln.who === 'conductor' ? 'conductor-voice' : '');
          if (ln.glitch) FX.staticBurst(380, 0.3);
          typing = typeText(el.storyText, ln.text, 24, true);
          el.storyNext.textContent = idx === lines.length - 1 ? 'BEGIN ▸' : 'CONTINUE ▸';
        },
        skip: function () { story = null; if (typing) typing.finish(); resolve(); }
      };
      story.next();
    });
  }

  function showInfo(kind, onBack) {
    showScreen('info');
    if (kind === 'credits') {
      el.infoTitle.textContent = 'CREDITS';
      el.infoBody.innerHTML = Story.credits.map(function (c) { return '<p>' + esc(c) + '</p>'; }).join('');
    } else {
      el.infoTitle.textContent = 'HOW TO PLAY';
      var html = Story.howTo.map(function (s) { return '<section class="how"><h3>' + esc(s[0]) + '</h3><p>' + esc(s[1]) + '</p></section>'; }).join('');
      var legend = '<div class="rarity-legend">' + H.CONFIG.rarityOrder.map(function (k) {
        return '<span>' + chip({ rarity: k }) + ' ' + ({ common: 'frequent', uncommon: 'moderate', rare: 'infrequent', veryrare: 'very rare', contraband: 'extremely rare' }[k] || '') + '</span>';
      }).join('') + '</div>';
      html += '<section class="how how-items"><h3>THE ' + Items.ALL_IDS.length + ' ITEMS</h3>' + legend + '<ul class="item-ref">' +
        Items.ALL_IDS.slice().sort(Items.byRarity).map(function (id) {
          var it = ITEMS[id];

  function showMatchIntro(def, conductorLine, G) {

      '<div class="dossier">' +
        '<div class="dossier-kicker">MATCH ' + pad(G.matchIndex + 1) + ' / ' + pad(H.CONFIG.matches) + ' · INCOMING COMPETITOR</div>' +

        '<div class="dossier-lives"><span>YOU ' + heartsHTML(H.CONFIG.startingLives, H.CONFIG.startingLives, 'mini') + '</span><span>THEM ' + heartsHTML(def.lives || H.CONFIG.startingLives, def.lives || H.CONFIG.startingLives, 'mini') + '</span></div>' +
        (conductorLine ? '<div class="dossier-conductor"><div class="cb-portrait">' + Face.conductor() + '</div><p><span class="speaker">THE CONDUCTOR</span>' + esc(conductorLine) + '</p></div>' : '') +
        '<button class="key key-primary" data-overlay="intro">BEGIN MATCH ▸</button>' +
      '</div>';

  function showIntermission(G) {
    var r = G.lastResult || {};
    var C = H.CONFIG;
    var oppCards = (r.oppHands || []).map(function (cards) {
      var t = Cards.handValue(cards).total;
      return '<div class="mini-hand">' + cards.map(function (c) { seen[c.uid] = true; return cardHTML(c, ' tiny'); }).join('') + '<span>' + t + (t > 21 ? ' BUST' : '') + '</span></div>';
    }).join('');
    var lossLine = '';
    if (r.winner === 'player') lossLine = 'OPPONENT LOST ' + r.applied + (r.applied === 1 ? ' LIFE' : ' LIVES') + ' · +' + r.tokens + (r.tokens === 1 ? ' TOKEN' : ' TOKENS');
    else if (r.winner === 'opp') lossLine = r.applied ? 'YOU LOST ' + r.applied + (r.applied === 1 ? ' LIFE' : ' LIVES') : 'TOURNIQUET HELD · NO LIFE LOST';
    else lossLine = 'NO LIVES LOST';
    if (r.line) lossLine = r.line;
    var full = G.player.inventory.length >= C.inventoryMax;
    var boughtOut = G.shop.bought >= C.shopPurchasesPerIntermission;
    var shop = G.shop.items.map(function (id, i) {
      if (!id) return '<div class="shop-item sold"><span class="shop-name">SOLD</span></div>';
      var it = ITEMS[id];
      var can = !full && !boughtOut && G.tokens >= C.shopPrice;
      var why = full ? 'INVENTORY FULL' : boughtOut ? 'ONE PER BREAK' : G.tokens < C.shopPrice ? 'NEED ' + C.shopPrice + ' TOKENS' : 'BUY · ◆' + C.shopPrice;
      return '<div class="shop-item r-' + rarityKey(it) + '" data-tip="' + esc(it.name + ' — ' + it.desc + ' ' + it.usage) + '">' + it.icon +
        '<span class="shop-name">' + esc(it.name) + '</span>' + chip(it) +
        '<span class="shop-desc">' + esc(it.desc) + '</span>' +

  /* ======================================================================
     MODALS
     ====================================================================== */
  var modalState = null;
  function modal(o) {
    closeModal();
    return new Promise(function (resolve) {
      var root = el.modalRoot;
      root.innerHTML = '<div class="modal-backdrop"></div><div class="modal ' + (o.cls || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.title || 'Dialog') + '">' +
        '<div class="modal-screen"><div class="modal-head">' + esc(o.title || '') + (o.tag ? '<span>' + esc(o.tag) + '</span>' : '') + '</div>' +
        '<div class="modal-body"></div>' +
        '<div class="modal-foot"></div></div><div class="scanlines"></div></div>';
      var body = root.querySelector('.modal-body');
      if (typeof o.html === 'string') body.innerHTML = o.html; else if (o.html) body.appendChild(o.html);
      var foot = root.querySelector('.modal-foot');
      (o.buttons || []).forEach(function (b) {
        var btn = document.createElement('button');
        btn.className = 'key ' + (b.cls || '');
        btn.textContent = b.label;
        if (b.disabled) btn.disabled = true;
        if (b.isDefault) btn.setAttribute('data-default', '1');
        btn.addEventListener('click', function () { FX.sfx('click'); close(b.value); });
        foot.appendChild(btn);
      });
      if (!foot.children.length) foot.hidden = true;
      root.hidden = false;
      function close(val) {
        if (!modalState || modalState.close !== close) return;
        modalState = null;
        root.hidden = true;
        root.innerHTML = '';
        resolve(val);
      }
      modalState = { close: close, dismiss: o.dismiss, root: root };
      root.querySelector('.modal-backdrop').addEventListener('click', function () { if (o.dismiss !== undefined) close(o.dismiss); });
      if (o.onMount) o.onMount(root, close);
      var first = root.querySelector('[data-default]') || root.querySelector('.modal button:not([disabled])');
      if (first) setTimeout(function () { try { first.focus(); } catch (e) { /* ignore */ } }, 30);
    });
  }
  function closeModal() {
    if (modalState) { var c = modalState.close, d = modalState.dismiss; c(d === undefined ? null : d); }
  }

  function confirmBox(title, text, okLabel) {
    return modal({
      title: title, html: '<p class="modal-text">' + esc(text) + '</p>', dismiss: false,
      buttons: [{ label: 'CANCEL', value: false }, { label: okLabel || 'OK', value: true, cls: 'key-danger', isDefault: true }]
    });
  }

      buttons: [{ label: 'CANCEL', value: null }],

        root.querySelectorAll('[data-pick]').forEach(function (b) {

  function showIntake(G, onConfirm) {
    var C = H.CONFIG;
    var existing = G.player.inventory.slice();
    var need = Math.max(0, existing.length + G.incoming.length - C.inventoryMax);
    var selected = {};
    var sealedN = G.sealedReturned || 0;
    var incomingHTML = G.incoming.map(function (id, i) {
      return '<div class="irow locked">' + itemRow({ id: id }, '<i class="ok">' + (i < sealedN ? 'RETURNED FROM ZIPLOCK BAG' : 'NEW · MUST ACCEPT') + '</i>') + '</div>';
    }).join('');
    var existingHTML = existing.length ? existing.map(function (inv) {
      return '<button class="irow pickable' + (need ? '' : ' static') + '" data-sac="' + inv.uid + '"' + (need ? '' : ' disabled') + '>' + itemRow({ id: inv.id }, need ? '<i class="sac-mark">KEEP</i>' : '<i class="ok">KEPT</i>') + '</button>';
    }).join('') : '<p class="modal-text dim">Nothing carried over.</p>';

    function label() {
      var n = Object.keys(selected).length;
      if (!need) return 'ACCEPT ITEMS ▸';
      return n === need ? 'SACRIFICE ' + n + ' & ACCEPT ▸' : 'SELECT ' + (need - n) + ' MORE TO SACRIFICE';
    }
    return modal({
      title: 'MON-02 // INVENTORY INTAKE', tag: 'MATCH ' + pad(G.matchIndex + 1), cls: 'intake',
      html:
        '<p class="modal-text">Both competitors receive ' + C.itemsPerMatch + ' items. Incoming items cannot be refused. ' +
        (need ? '<b class="amber">You can hold ' + C.inventoryMax + '. Choose ' + need + ' existing item' + (need > 1 ? 's' : '') + ' to sacrifice.</b>' : 'You have room for everything.') + '</p>' +
        '<div class="intake-cols"><section><h4>INCOMING (' + G.incoming.length + ')</h4><div class="item-list">' + incomingHTML + '</div></section>' +
        '<section><h4>YOUR INVENTORY (' + existing.length + ')</h4><div class="item-list">' + existingHTML + '</div></section></div>' +
        '<p class="modal-text dim">Your opponent also received ' + C.itemsPerMatch + ' items. Theirs stay hidden.</p>',
      buttons: [{ label: label(), value: 'ok', cls: 'key-primary intake-ok', disabled: need > 0, isDefault: true }],
      onMount: function (root) {
        var ok = root.querySelector('.intake-ok');
        root.querySelectorAll('[data-sac]').forEach(function (b) {
          b.addEventListener('click', function () {
            if (!need) return;
            var uid = b.getAttribute('data-sac');
            if (selected[uid]) delete selected[uid];
            else if (Object.keys(selected).length < need) selected[uid] = true;
            else { FX.sfx('error'); return; }
            FX.sfx('click');
            b.classList.toggle('sacrificed', !!selected[uid]);
            b.querySelector('.sac-mark').textContent = selected[uid] ? 'SACRIFICE' : 'KEEP';
            ok.textContent = label();
            ok.disabled = Object.keys(selected).length !== need;
          });
        });
      }
    }).then(function (v) {
      if (v === 'ok') onConfirm(Object.keys(selected));
    });
  }

  function menu(state) {

  /* ======================================================================
     TOOLTIPS
     ====================================================================== */
  var tipTarget = null;
  function showTip(t) {
    var text = t.getAttribute('data-tip');
    if (!text) return;
    tipTarget = t;
    el.tooltip.textContent = text;
    el.tooltip.hidden = false;
    var r = t.getBoundingClientRect();
    var tw = el.tooltip.offsetWidth, th = el.tooltip.offsetHeight;
    var x = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left + r.width / 2 - tw / 2));
    var y = r.top - th - 8;
    if (y < 8) y = r.bottom + 8;
    el.tooltip.style.left = x + 'px';
    el.tooltip.style.top = y + 'px';
  }
  function hideTip() { tipTarget = null; el.tooltip.hidden = true; }

  /* ======================================================================
     KEYS
     ====================================================================== */
  function handleKey(ev) {
    var k = (ev.key || '').toLowerCase();
    if (modalState) {
      if (k === 'escape' && modalState.dismiss !== undefined) { closeModal(); ev.preventDefault(); }
      return true;
    }
    if (activeScreen === 'story') {
      if (k === 'enter' || k === ' ' || k === 'arrowright') { if (story) story.next(); ev.preventDefault(); }
      else if (k === 'escape' && story) story.skip();
      return true;
    }
    if (activeScreen === 'info') {
      if (k === 'escape' || k === 'enter') { el.infoBack.click(); ev.preventDefault(); }
      return true;
    }
    if (activeScreen === 'result') {
      if (k === 'enter') { el.resultBtn.click(); ev.preventDefault(); }
      return true;
    }
    if (activeScreen === 'title' || activeScreen === 'multi') return true;
    return false;
  }

  /* ======================================================================
     INIT
     ====================================================================== */
  function init(h) {
    handlers = h;
    // Rarity colours come from config.js so they live in one place.
    Object.keys(H.CONFIG.rarities).forEach(function (k) {
      document.documentElement.style.setProperty('--r-' + k, H.CONFIG.rarities[k].color);
    });
    ['room', 'layerBg', 'layerFrames', 'layerFg', 'livesBody', 'invBody', 'invCount', 'handBody', 'handTotalTop',
      'actStatus', 'turnTag', 'btnHit', 'btnStand', 'btnDouble', 'btnSplit', 'btnItem', 'btnPrimary',
      'oppName', 'oppLivesTop', 'oppFace', 'oppSpeech', 'oppCards', 'm5Overlay', 'oppStage',
      'logList', 'logFooter', 'logStatus', 'mon1', 'mon2', 'mon3', 'mon4', 'mon5', 'mon6',
      'banner', 'menuBtn', 'modalRoot', 'tooltip', 'staticCanvas',
      'tContinue', 'tNew', 'tHow', 'tCredits', 'tSound', 'tFx',
      'storyTag', 'storyText', 'storyPortrait', 'storyNext', 'storySkip',
      'infoTitle', 'infoBody', 'infoBack',
      'resultKicker', 'resultTitle', 'resultSub', 'resultPortrait', 'resultBtn', 'resultBtn2'
    ].forEach(function (id) { el[id] = $(id); });
    el.scr_title = $('scrTitle'); el.scr_story = $('scrStory'); el.scr_info = $('scrInfo'); el.scr_result = $('scrResult'); el.scr_multi = $('scrMulti');

    var band = document.createElement('div');
    band.className = 'conductor-band';
    band.hidden = true;
    el.oppStage.appendChild(band);
    el.conductorBand = band;

    // Action buttons
    [el.btnHit, el.btnStand, el.btnDouble, el.btnSplit, el.btnItem].forEach(function (b) {
      b.addEventListener('click', function () { FX.sfx('click'); handlers.onAction(b.getAttribute('data-act')); });
    });
    el.btnPrimary.addEventListener('click', function () { FX.sfx('click'); handlers.onPrimary(); });

    // Inventory slots (delegated)
    el.invBody.addEventListener('click', function (ev) {
      var s = ev.target.closest ? ev.target.closest('[data-uid]') : null;
      if (s) { FX.sfx('click'); handlers.onInspect(s.getAttribute('data-uid')); }
    });

    // M5 overlay buttons (delegated)
    el.m5Overlay.addEventListener('click', function (ev) {
      var t = ev.target.closest ? ev.target.closest('button') : null;
      if (!t) return;
      if (t.hasAttribute('data-buy')) { handlers.onBuy(parseInt(t.getAttribute('data-buy'), 10)); return; }
      var o = t.getAttribute('data-overlay');
      FX.sfx('click');
      if (o === 'intro') handlers.onIntro();
      else if (o === 'next') handlers.onPrimary();
    });

    // Title
    el.tNew.addEventListener('click', function () { FX.sfx('click'); handlers.onNewGame(); });
    el.tContinue.addEventListener('click', function () { FX.sfx('click'); handlers.onContinue(); });
    el.tHow.addEventListener('click', function () { FX.unlockAudio(); FX.sfx('click'); showInfo('how', function () { showScreen('title'); }); });
    el.tCredits.addEventListener('click', function () { FX.unlockAudio(); FX.sfx('click'); showInfo('credits', function () { showScreen('title'); }); });
    el.tSound.addEventListener('click', function () { FX.unlockAudio(); FX.setSound(!FX.settings.sound); updateTitleSettings(); FX.sfx('click'); });
    el.tFx.addEventListener('click', function () { FX.setFx(FX.settings.fx === 'full' ? 'low' : 'full'); updateTitleSettings(); FX.sfx('click'); });

    // Story
    el.storyNext.addEventListener('click', function () { if (story) story.next(); });
    el.storySkip.addEventListener('click', function () { if (story) story.skip(); });
    el.scr_story.addEventListener('click', function (ev) {
      if (ev.target.closest && ev.target.closest('button')) return;
      if (story) story.next();
    });

    el.infoBack.addEventListener('click', function () { FX.sfx('click'); if (infoBack) infoBack(); });
    el.resultBtn.addEventListener('click', function () { FX.sfx('click'); if (resultResolve) { var r = resultResolve; resultResolve = null; r(1); } });
    el.resultBtn2.addEventListener('click', function () { FX.sfx('click'); if (resultResolve) { var r = resultResolve; resultResolve = null; r(2); } });
    el.menuBtn.addEventListener('click', function () { FX.sfx('click'); handlers.onMenu(); });

    // Tooltips (mouse + keyboard focus; skipped for touch)
    document.addEventListener('mouseover', function (ev) {
      var t = ev.target.closest ? ev.target.closest('[data-tip]') : null;
      if (t && t !== tipTarget) showTip(t);
      else if (!t && tipTarget) hideTip();
    });
    document.addEventListener('focusin', function (ev) {
      var t = ev.target.closest ? ev.target.closest('[data-tip]') : null;
      if (t) showTip(t); else hideTip();
    });
    document.addEventListener('pointerdown', function (ev) { if (ev.pointerType === 'touch') hideTip(); FX.unlockAudio(); });
    document.addEventListener('scroll', hideTip, true);

    document.addEventListener('keydown', function (ev) { handlers.onKey(ev); });

    // The parallax layers are larger than the room; never let focus or
    // scroll-into-view shift the room (older Chrome lacks overflow: clip).
    el.room.addEventListener('scroll', function () {
      if (getComputedStyle(el.room).position === 'fixed' && (el.room.scrollLeft || el.room.scrollTop)) {
        el.room.scrollLeft = 0; el.room.scrollTop = 0;
      }
    });

    // Effects
    FX.initStatic(el.staticCanvas);
    FX.initParallax({ bg: el.layerBg, frames: el.layerFrames, fg: el.layerFg, root: el.room });
    FX.onPointer(function (nx, ny) {
      // Eyes follow the cursor: the opponent watches you.
      var svg = el.oppFace.querySelector('svg');
      if (!svg) return;
      var r = el.oppFace.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height * 0.45;
      var px = (nx + 1) / 2 * window.innerWidth, py = (ny + 1) / 2 * window.innerHeight;
      Face.gaze(svg, (px - cx) / (window.innerWidth / 2), (py - cy) / (window.innerHeight / 2));
    });
  }

  function doAction(i, kind, auto) {

  function validParams(p, uid, it, params) {

  function settleBusts() {

    order.forEach(function (i) {

  function mysteriesOf(p) {

  /* ---- incoming actions ---- */
  function validTarget(i, g) {

  function enqueue(i, act) {
    if (!HOST) return;

    }).catch(function (e) { if (window.console) console.error('[mp]', e); });

  function handle(i, act) {

    }

    function done() { if (HOST) { HOST.busy = false; HOST.autoPending = false; } publish(); }
    var t = act.t;

        if (!ok) { announce(i, 'CANNOT USE THAT NOW', false); return; }

  function idxOfPeer(peer) {
    var P = hS().players;
    for (var i = 0; i < P.length; i++) if (P[i].peer === peer) return i;
    return -1;

  /** Read every peer's latest action. Runs on room updates and on a timer

  /* ======================================================================
     4. CLIENT — everyone, the host included

  var C = {

  function loadProfile() {

    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
    var timeout = new Promise(function (res) { setTimeout(function () { res(null); }, 10000); });
    return Promise.race([window.claude.use('room'), timeout]).then(function (room) {
      C.room = room || null;
      return C.room;
    }, function () { return null; });
  }

  function openMulti() {
    FX.unlockAudio();
    loadProfile();
    UI.showScreen('multi');
    C.stage = 'connecting';
    renderMulti();
    connect().then(function (room) {
      if (!room) { C.stage = 'unavailable'; renderMulti(); return; }
      C.stage = 'menu';
      renderMulti();
    });
  }

  function cleanupRooms() {
    C.unsubs.forEach(function (u) { try { u(); } catch (e) { /* ignore */ } });
    C.unsubs = [];
    clearInterval(C.qTimer); C.qTimer = 0;
    if (C.queue) { C.queue.leave().catch(noop); C.queue = null; }
    if (C.match) { C.match.leave().catch(noop); C.match = null; }
    stopHost();
  }

  function resetMatchView() {
    C.S = null; C.gameId = null; C.lastN = 0; C.myIdx = -1; C.pending = null; C.outbox = [];
    C.log = []; C.logSeen = 0; C.answered = {}; C.askOpen = null; C.lastPhase = null; C.interSig = '';
    C.overlay = false; C.hostPeer = null; C.isHost = false; C.expect = null;
    clearInterval(C.uiTimer); C.uiTimer = 0;
    var stage = $('oppStage');
    if (stage) stage.classList.remove('ffa');
    if ($('mon5')) $('mon5').classList.remove('ffa-mode');
    var grid = $('ffaGrid');
    if (grid) grid.innerHTML = '';
    C.ffaCells = {};
  }

  function leaveAll(toTitle) {
    cleanupRooms();
    resetMatchView();
    UI.closeModal();
    UI.hideOverlay();
    C.stage = 'menu';
    if (toTitle) UI.showScreen('title');
    else { UI.showScreen('multi'); renderMulti(); }
  }

  /* ---- public matchmaking ---- */
  function findPublic() {
    cleanupRooms(); resetMatchView();
    C.kind = 'public';
    C.stage = 'queue';
    renderMulti();
    C.room.join('h21-q-' + C.mode).then(function (q) {
      C.queue = q;
      q.presence({ nm: C.name, av: C.av, q: now() }).catch(noop);
      C.unsubs.push(q.onPeers(function () { evaluateQueue(); }, function () { notice('Lost the matchmaking room. Try again.'); }));
      C.qTimer = setInterval(evaluateQueue, 1000);
    }, function (e) { notice(joinError(e)); });
  }

  function evaluateQueue() {
    var q = C.queue;
    if (!q || C.stage !== 'queue') return;
    var me = myPeer(q);
    if (!me) return;
    var peers = q.peers().filter(function (p) { return p.presence && typeof p.presence.q === 'number'; });
    // Has someone picked me for a table?
    for (var i = 0; i < peers.length; i++) {
      var pk = peers[i].presence.pk;
      if (pk && pk.c && pk.ps && pk.ps.indexOf(me) >= 0) { goMatch(pk.c, peers[i].peer, pk.ps, peers[i].peer === me); return; }
    }
    var picked = {};
    peers.forEach(function (p) { var pk = p.presence.pk; if (pk && pk.ps) pk.ps.forEach(function (x) { picked[x] = 1; }); });
    var free = peers.filter(function (p) { return !picked[p.peer]; }).sort(function (a, b) {
      return (a.presence.q - b.presence.q) || (a.peer < b.peer ? -1 : 1);
    });
    var waitEl = $('mpWaiting');
    if (waitEl) waitEl.textContent = Math.min(free.length, need()) + ' / ' + need() + ' PLAYERS';
    if (free.length >= need() && free[0].peer === me) {
      var ps = free.slice(0, need()).map(function (p) { return p.peer; });
      var code = randCode();
      q.presence({ pk: { c: code, ps: ps } }).catch(noop);
      goMatch(code, me, ps, true);
    }
  }

  function goMatch(code, hostPeer, ps, amHost) {
    if (C.stage !== 'queue') return;
    C.stage = amHost ? 'gathering' : 'waiting';
    C.code = code; C.hostPeer = hostPeer; C.isHost = amHost; C.expect = ps;
    C.gatherUntil = now() + M().gatherMs;
    renderMulti();
    joinMatchRoom('h21-m-' + code.toLowerCase(), amHost).then(function () {
      if (!amHost && C.queue) { C.queue.leave().catch(noop); C.queue = null; clearInterval(C.qTimer); }
    });
  }

  /* ---- private rooms ---- */
  function createPrivate() {
    cleanupRooms(); resetMatchView();
    C.kind = 'private';
    C.code = randCode();
    C.stage = 'lobby';
    C.isHost = true;
    renderMulti();
    joinMatchRoom('h21-p-' + C.code.toLowerCase(), true);
  }

  function joinPrivate(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    if (code.length !== 5) { notice('Room codes are 5 letters and numbers.'); return; }
    cleanupRooms(); resetMatchView();
    C.kind = 'private';
    C.code = code;
    C.stage = 'joining';
    C.isHost = false;
    C.joinWait = now() + 7000;
    renderMulti();
    joinMatchRoom('h21-p-' + code.toLowerCase(), false);
  }

  function joinMatchRoom(name, amHost) {
    return C.room.join(name).then(function (room) {
      C.match = room;
      var pres = { nm: C.name, av: C.av, j: now(), hs: amHost ? 1 : 0, md: C.mode };
      room.presence(pres).catch(noop);
      C.unsubs.push(room.onPeers(onMatchPeers, function () { notice('Lost connection to the room.'); }));
      if (!C.qTimer) C.qTimer = setInterval(lobbyTick, 1000);
      else { clearInterval(C.qTimer); C.qTimer = setInterval(lobbyTick, 1000); }
      renderMulti();
    }, function (e) { notice(joinError(e)); });
  }

  function joinError(e) {
    var code = e && e.code;
    if (code === 'limit_reached') return 'Too many rooms open right now. Try again in a moment.';
    if (code === 'not_permitted' || code === 'not_granted') return 'This page cannot join multiplayer rooms for your account.';
    return 'Could not reach the room. Check your connection and try again.';
  }

  function notice(msg) {
    C.notice = msg;
    if (C.stage !== 'match') { C.stage = 'menu'; cleanupRooms(); renderMulti(); }
    else UI.flashStatus(msg.toUpperCase());
  }

  function roomPeers() {
    if (!C.match) return [];
    return C.match.peers().filter(function (p) { return p.presence && typeof p.presence.j === 'number'; })
      .slice().sort(function (a, b) { return (a.presence.j - b.presence.j) || (a.peer < b.peer ? -1 : 1); });
  }

  function lobbyHostPeer() {
    var hs = roomPeers().filter(function (p) { return p.presence.hs; });
    return hs.length ? hs[0].peer : null;
  }

  function onMatchPeers(change) {
    if (!C.match) return;
    if (HOST) {
      change.left.forEach(function (p) { playerLeft(p.peer); });
      pollPeers(change.peers);
    }
    // Host left mid-match?
    if (C.S && C.hostPeer && C.S.phase !== 'over') {
      change.left.forEach(function (p) { if (p.peer === C.hostPeer && !C.isHost) hostGone(); });
    }
    if (!C.hostPeer && C.kind === 'private') {
      var hp = lobbyHostPeer();
      if (hp) { C.hostPeer = hp; if (C.stage === 'joining') C.stage = 'lobby'; }
    }
    // The host's table
    var host = null;
    change.peers.forEach(function (p) { if (p.peer === C.hostPeer) host = p; });
    if (host && host.presence && host.presence.g && !(host.isMe && host.sameTab)) onState(host.presence.g, false);
    if (C.kind === 'private' && host && host.presence && host.presence.md && !C.isHost) C.mode = host.presence.md;
    lobbyTick();
  }

  function lobbyTick() {
    if (C.stage === 'joining' && now() > C.joinWait && !C.hostPeer) {
      notice('No room found with code ' + C.code + '.');
      return;
    }
    if (C.stage === 'gathering' && C.match) {
      var present = roomPeers().map(function (p) { return p.peer; });
      var arrived = C.expect.filter(function (x) { return present.indexOf(x) >= 0; });
      var full = arrived.length === C.expect.length;
      var late = now() > C.gatherUntil;
      if (full || (late && arrived.length >= (C.mode === 'duel' ? 2 : 3))) startHosting(arrived);
      else if (late) { C.stage = 'menu'; findPublic(); return; }
    }
    if (C.stage === 'waiting' && C.match && now() > C.gatherUntil + 8000 && !C.S) {
      C.stage = 'menu'; findPublic(); return;
    }
    if (C.stage === 'lobby' || C.stage === 'joining' || C.stage === 'gathering' || C.stage === 'waiting') renderMulti();
    if (HOST) pollPeers();
  }

  function rosterFrom(peerList) {
    var map = {};
    roomPeers().forEach(function (p) { map[p.peer] = p; });
    return peerList.filter(function (pr) { return map[pr]; }).map(function (pr) {
      var pp = map[pr].presence;
      return { peer: pr, name: cleanName(pp.nm) || 'PLAYER', av: (typeof pp.av === 'number' && pp.av >= 0 && pp.av < AVATARS.length) ? pp.av : 0 };
    });
  }

  function startHosting(peerList) {
    if (!C.match) return;
    var me = myPeer(C.match);
    C.hostPeer = me;
    C.isHost = true;
    if (C.queue) { C.queue.leave().catch(noop); C.queue = null; }
    hostCreate(C.match, C.mode, rosterFrom(peerList));
  }

  function startPrivate() {
    var ps = roomPeers();
    var cap = C.mode === 'duel' ? 2 : 4;
    var min = C.mode === 'duel' ? 2 : 3;
    if (ps.length < min) return;
    startHosting(ps.slice(0, cap).map(function (p) { return p.peer; }));
  }

  function hostGone() {
    if (!C.S || C.S.phase === 'over') return;
    UI.closeModal();
    UI.hideOverlay();
    C.shownOver = C.gameId;
    UI.showResult({ kicker: 'MATCH ENDED', title: 'HOST LEFT', sub: 'The player running this table disconnected, so the match cannot continue.', portrait: 'conductor', btn: 'BACK', btn2: 'TITLE' }).then(function (w) {
      leaveAll(w === 2);
    });
  }

  /* ---- receiving the table ---- */
  function decode(w) {
    return {
      id: w.id, mode: w.m, phase: w.ph, round: w.rd, turn: w.tn, ds: w.ds, winner: w.w, seq: w.n,
      deadline: w.dl, revealUntil: w.ru, fx: w.fx, res: w.rs, log: w.lg || [],
      asks: (w.ak || []).map(function (a) { return { id: a[0], p: a[1], k: a[2], d: a[3], u: a[4] }; }),
      players: (w.P || []).map(function (q) {
        return {
          peer: q.pr, name: cleanName(q.nm) || 'PLAYER', av: q.av | 0, lives: q.lv, tokens: q.tk, left: !!q.lf,
          inventory: (q.iv || []).map(function (a) { return { uid: a[0], id: a[1], offer: a[2] || null }; }).filter(function (x) { return ITEMS[x.id]; }),
          hands: (q.h || []).map(function (a) { return { cards: decList(a[0]), stood: !!a[1], drawn: a[2] ? a[2].split(',') : [] }; }),
          initial: decList(q.in), prevInitial: q.pv ? decList(q.pv) : null,
          doubled: !!q.db, split: !!q.sp, itemsUsedThisRound: q.iu | 0, intel: { x: q.x || null, b: q.b || null },
          shop: q.sh || [], bought: q.bo | 0, ready: !!q.rd, ack: q.ac | 0, bn: q.bn || null
        };
      })
    };
  }

  function hostTime(t) { return t + C.offset; } // host clock -> local clock

  function onState(w, local) {
    if (!w || typeof w !== 'object' || !w.id) return;
    if (w.id === C.gameId && w.n <= C.lastN) return;
    var me = C.match ? myPeer(C.match) : null;
    var roster = (w.P || []).map(function (p) { return p.pr; });
    if (w.id !== C.gameId) {
      if (C.dismissed[w.id]) return;
      if (me && roster.indexOf(me) < 0) {
        if (C.stage === 'lobby' || C.stage === 'joining') { C.notice = 'A game is already running in this room.'; renderMulti(); }
        return;
      }
      if (w.ph === 'over') return;
      C.gameId = w.id; C.log = []; C.logSeen = 0; C.answered = {}; C.askOpen = null;
      C.lastPhase = null; C.interSig = ''; C.pending = null; C.outbox = []; C.ffaCells = {};
      var grid = $('ffaGrid'); if (grid) grid.innerHTML = '';
    }
    C.lastN = w.n;
    C.offset = local ? 0 : now() - w.hn;
    C.S = decode(w);
    C.myIdx = me ? roster.indexOf(me) : -1;
    if (C.stage !== 'match') enterMatch();
    var mine = C.myIdx >= 0 ? C.S.players[C.myIdx] : null;
    // Acknowledged actions free the outbox.
    if (mine && C.pending && mine.ack >= C.pending.s) {
      C.pending = null;
      if (C.outbox.length) flushOutbox();
    }
    // Log
    C.S.log.forEach(function (e) {
      if (e.n <= C.logSeen) return;
      C.logSeen = e.n;
      var d = displayEntry(e);
      if (d) C.log.push(d);
    });
    if (C.log.length > 150) C.log.splice(0, C.log.length - 150);
    // Personal banner
    if (mine && mine.bn && mine.bn.n !== C.lastBanner) {
      C.lastBanner = mine.bn.n;
      UI.banner(mine.bn.t, mine.bn.g ? 'good' : 'bad');
      FX.sfx(mine.bn.g ? 'item' : 'error');
    }
    phaseEffects();
    render();
    handleAsks();
  }

  function nameOf(i) {
    if (i === C.myIdx) return 'YOU';
    var p = C.S && C.S.players[i];
    return p ? p.name : '?';
  }
  function displayEntry(e) {
    var me = C.myIdx;
    var z = e.z ? String(e.z).replace('{T}', e.t !== null && e.t !== undefined ? nameOf(e.t) : 'THEM') : null;
    if (e.a === me && me >= 0 && e.x) return { who: 'player', text: e.x, kind: e.k };
    if (e.t === me && me >= 0 && e.y && e.a !== me) return { who: 'opp', text: nameOf(e.a) + ': ' + e.y, kind: e.k };
    if (!z) return null;
    if (e.a === null || e.a === undefined) return { who: 'sys', text: z, kind: e.k };
    if (e.a === me) return { who: 'player', text: z, kind: e.k };
    return { who: 'opp', text: nameOf(e.a) + ' ' + z, kind: e.k };
  }

  function enterMatch() {
    C.stage = 'match';
    UI.closeModal();
    UI.hideOverlay();
    UI.showScreen(null);
    var S = C.S;
    if (S.mode === 'duel') {
      $('oppStage').classList.remove('ffa');
      $('mon5').classList.remove('ffa-mode');
      var o = duelOpp();
      if (o >= 0) UI.setOpponent(oppDef(o));
    } else {
      UI.setOpponent({ id: 'ffa-' + S.id, name: 'FREE FOR ALL', alias: S.players.length + ' PLAYERS', look: AVATARS[0], traits: {}, lines: {} });
      $('oppStage').classList.add('ffa');
    }
    clearInterval(C.uiTimer);
    C.uiTimer = setInterval(function () {
      if (C.stage !== 'match' || !C.S) return;
      render();
      if (C.pending && now() - C.pendingAt > 6000) resend();
    }, 1000);
    FX.staticBurst(400, 0.3);
  }

  function duelOpp() {
    if (!C.S) return -1;
    for (var i = 0; i < C.S.players.length; i++) if (i !== C.myIdx) return i;
    return -1;
  }
  function oppDef(i) {
    var p = C.S.players[i];
    return { id: 'mp-' + C.S.id + '-' + i, name: p.name, alias: 'ONLINE', personality: 'Human', look: AVATARS[p.av] || AVATARS[0], traits: {}, lines: {}, dossier: '', traitText: '' };
  }

  function phaseEffects() {
    var S = C.S, ph = S.phase;
    if (ph === C.lastPhase && S.round === C.lastRound) return;
    var prev = C.lastPhase;
    C.lastPhase = ph; C.lastRound = S.round;
    if (ph === 'play' && prev !== 'play') {
      UI.hideOverlay(); C.overlay = false; C.interSig = '';
      UI.banner('ROUND ' + pad(S.round));
      FX.sfx('deal');
    }
    if (ph === 'resolve' && S.res) roundBanner();
    if (ph === 'inter') { if (prev !== 'resolve' && S.res) roundBanner(); }
    if (ph === 'over' && C.shownOver !== S.id) showOver();
  }

  function roundBanner() {
    var r = C.S.res, me = C.myIdx;
    if (!r) return;
    var lostMine = 0;
    r.l.forEach(function (x) { if (x[0] === me) lostMine = x[1]; });
    var lostAny = r.l.some(function (x) { return x[0] === me; });
    if (r.w.indexOf(me) >= 0) { UI.banner('ROUND WON', 'good'); FX.sfx('win'); }
    else if (lostAny) { UI.banner(lostMine ? 'ROUND LOST' : 'TOURNIQUET HELD', 'bad'); if (lostMine) UI.lifeFlash('player'); }
    else UI.banner(r.w.length ? 'SAFE' : 'DRAW');
    if (C.S.mode === 'duel') {
      var o = duelOpp();
      if (r.w.indexOf(o) >= 0) UI.setExpression('celebrate');
      else if (r.l.some(function (x) { return x[0] === o; })) UI.setExpression('hurt');
      else UI.setExpression('thinking');
    }
  }

  function showOver() {
    var S = C.S, me = C.myIdx;
    C.shownOver = S.id;
    UI.closeModal(); UI.hideOverlay();
    FX.staticBurst(900, 0.45);
    var won = S.winner === me && me >= 0;
    var title = S.winner === null ? 'DRAW' : (won ? 'VICTORY' : 'DEFEAT');
    var sub = S.winner === null ? 'Nobody walked away from this table.'
      : won ? (S.mode === 'duel' ? 'You took every one of their lives.' : 'Last one standing out of ' + S.players.length + '.')
        : (S.players[S.winner].name + ' outlasted you.');
    setTimeout(function () {
      UI.showResult({
        kicker: 'ONLINE · ' + (S.mode === 'duel' ? '1V1' : 'FREE FOR ALL') + ' · ' + S.round + ' ROUNDS',
        title: title, sub: sub, portrait: 'conductor',
        btn: C.kind === 'private' ? 'BACK TO ROOM' : 'FIND ANOTHER', btn2: 'LEAVE'
      }).then(function (w) {
        C.dismissed[S.id] = 1;
        if (w === 2) { leaveAll(true); return; }
        if (C.kind === 'private') {
          var keepHost = C.isHost;
          stopHost();
          resetMatchView();
          C.isHost = keepHost;
          C.hostPeer = keepHost ? myPeer(C.match) : lobbyHostPeer();
          C.stage = 'lobby';
          UI.showScreen('multi');
          renderMulti();
        } else {
          findPublic();
          UI.showScreen('multi');
        }
      });
    }, 1400);
  }

  /* ---- sending actions ---- */
  function sendAct(act) {
    if (!C.S || C.myIdx < 0) return;
    act.gid = C.S.id;
    if (HOST && C.isHost) {
      if (act.t === 'ans') answer(C.myIdx, act.k, act.v);
      else enqueue(C.myIdx, act);
      return;
    }
    C.seq += 1;
    act.s = C.seq;
    if (C.pending) { C.outbox.push(act); return; }
    C.pending = act; C.pendingAt = now();
    C.match.presence({ a: act }).catch(noop);
    render();
  }
  function flushOutbox() {
    var nx = C.outbox.shift();
    if (!nx) return;
    C.pending = nx; C.pendingAt = now();
    C.match.presence({ a: nx }).catch(noop);
  }
  function resend() {
    if (!C.pending || !C.match) return;
    C.pending.r = (C.pending.r || 0) + 1;
    C.pendingAt = now();
    C.match.presence({ a: C.pending }).catch(noop);
  }

  /* ---- prompts from the host ---- */
  function handleAsks() {
    var S = C.S, me = C.myIdx;
    if (!S || me < 0) return;
    var mineAsks = S.asks.filter(function (a) { return a.p === me; });
    if (C.askOpen && !mineAsks.some(function (a) { return a.id === C.askOpen; })) { C.askOpen = null; UI.closeModal(); }
    if (C.askOpen) return;
    var a = mineAsks.filter(function (x) { return !C.answered[x.id]; })[0];
    if (!a) return;
    C.askOpen = a.id;
    UI.closeModal();
    var p = S.players[me];
    var reply = function (v) {
      if (C.answered[a.id]) return;
      C.answered[a.id] = 1;
      if (C.askOpen === a.id) C.askOpen = null;
      sendAct({ t: 'ans', k: a.id, v: v === undefined ? null : v });
    };
    if (a.k === 'dw') {
      UI.chooseDeadWeight((a.d || []).map(dec)).then(function (v) { if (v === null || v === undefined) return; reply(v === 1 ? 1 : 0); });
    } else if (a.k === 'gb') {
      var invs = p.inventory.filter(function (x) { return (a.d || []).indexOf(x.uid) >= 0; });
      UI.chooseGiveBack(invs).then(function (uid) { if (uid) reply(uid); });
    } else if (a.k === 'my') {
      UI.chooseMystery(a.d).then(function (keep) { if (C.askOpen === a.id || !C.answered[a.id]) reply(keep === true); });
    } else if (a.k === 'rescue') {
      var opts = p.inventory.filter(function (x) { return (a.d && a.d.o || []).indexOf(x.uid) >= 0; });
      UI.rescuePrompt(a.d && a.d.t, opts).then(function (uid) {
        if (C.answered[a.id]) return;
        if (!uid) { reply(null); return; }
        var it = ITEMS[(findInv(p, uid) || {}).id];
        if (!it) { reply(null); return; }
        gather(it, uid, 'rescue', opponentsOf(S, me)[0]).then(function (g) {
          if (!g) { reply(null); return; }
          reply({ u: uid, p: g.params });
        });
      });
    }
  }

  /* ---- choosing item parameters (and a target, in a free-for-all) ---- */
  function chooseTarget(id, win, prompt) {
    var S = C.S, me = C.myIdx;
    var opps = opponentsOf(S, me);
    if (opps.length <= 1) return Promise.resolve(opps.length ? opps[0] : null);
    var uidOk = function (t) {
      var it = ITEMS[id];
      if (immune(S, t) && it.hostile) return { ok: true, reason: 'FLU SHOT · IT WILL BOUNCE' };
      return it.canUse(makeE(S, me, t, READONLY), 'player', win);
    };
    return UI.modal({
      title: (prompt || ITEMS[id].name) + ' — choose a target', tag: 'WHO?', dismiss: null,
      html: '<div class="item-list">' + opps.map(function (t) {
        var p = S.players[t], r = uidOk(t);
        return '<button class="irow pickable target-row" data-pick="' + t + '"' + (r.ok ? '' : ' disabled') + '>' +
          '<div class="target-face">' + Face.build(AVATARS[p.av] || AVATARS[0]) + '</div>' +
          '<div class="irow-text"><b>' + esc(p.name) + '</b><span>' + livesText(p.lives) + ' · ' + cardCount(p) + ' CARDS · ' + p.inventory.length + ' ITEMS</span>' +
          (r.ok ? (r.reason ? '<i class="no">' + esc(r.reason) + '</i>' : '') : '<i class="no">' + esc(r.reason) + '</i>') + '</div></button>';
      }).join('') + '</div>',
      buttons: [{ label: 'CANCEL', value: null }],
      onMount: function (root, close) {
        root.querySelectorAll('[data-pick]').forEach(function (b) {
          b.addEventListener('click', function () { if (!b.disabled) { FX.sfx('click'); close(parseInt(b.getAttribute('data-pick'), 10)); } });
        });
      }
    });
  }

  function gather(it, uid, win, target) {
    var S = C.S, me = C.myIdx, p = S.players[me];
    if (!it.ask) return Promise.resolve({ params: {}, target: target });
    if (it.ask === 'card') {
      var h = focusHand(p);
      var cards = h.cards.filter(function (c) { return !c.mystery && (it.cardFilter ? it.cardFilter(c) : true); });
      return UI.chooseCard(cards, it.askTitle).then(function (u) { return u ? { params: { cardUid: u }, target: target } : null; });
    }
    if (it.ask === 'value') {
      return UI.chooseValue(it.askMin || 1, it.askMax || 5, it.askTitle, it.askText).then(function (v) { return v ? { params: { value: v }, target: target } : null; });
    }
    if (it.ask === 'item') {
      var others = p.inventory.filter(function (x) { return x.uid !== uid; });
      return UI.chooseItem(others, it.askTitle, it.id).then(function (u) { return u ? { params: { itemUid: u }, target: target } : null; });
    }
    if (it.ask === 'pandora') {
      var box = findInv(p, uid);
      var offer = (box && box.offer) || [];
      var opts = offer.map(function (id) {
        var inner = ITEMS[id];
        var ok = inner.windows.indexOf(win) >= 0;
        var r = ok ? { ok: false, reason: 'NO VALID TARGET' } : { ok: false, reason: win === 'between' ? 'ONLY DURING A HAND' : 'ONLY BETWEEN ROUNDS' };
        if (ok) {
          var ts = TARGETED.indexOf(id) >= 0 ? opponentsOf(S, me) : [opponentsOf(S, me)[0]];
          for (var k = 0; k < ts.length; k++) {
            if (ts[k] === undefined) continue;
            r = inner.canUse(makeE(S, me, ts[k], READONLY), 'player', win);
            if (r.ok) break;
          }
        }
        return { id: id, item: inner, ok: r.ok, reason: r.reason };
      });
      return UI.choosePandora(opts, it.askTitle).then(function (id) {
        if (!id) return null;
        var inner = ITEMS[id];
        var tp = TARGETED.indexOf(id) >= 0 ? chooseTarget(id, win) : Promise.resolve(target);
        return tp.then(function (t2) {
          if (t2 === null || t2 === undefined) return null;
          return gather(inner, uid, win, t2).then(function (g) {
            return g ? { params: { choice: id, inner: g.params }, target: t2 } : null;
          });
        });
      });
    }
    return Promise.resolve({ params: {}, target: target });
  }

  function windowNow() {
    var S = C.S, me = C.myIdx;
    if (!S || me < 0 || !alive(S.players[me])) return null;
    if (S.phase === 'inter') return 'between';
    if (S.phase === 'play' && S.turn === me && !isDone(S.players[me])) return 'turn';
    return null;
  }

  function useFlow(uid) {
    var S = C.S, me = C.myIdx, win = windowNow();
    if (!S || me < 0) return;
    if (!win || C.pending) { UI.flashStatus('NOT RIGHT NOW'); return; }
    var p = S.players[me], inv = findInv(p, uid);
    if (!inv) return;
    var it = ITEMS[inv.id];
    var chk = mpCanUse(S, me, uid, win, null);
    if (!chk.ok) { UI.flashStatus(chk.reason); FX.sfx('error'); return; }
    var tp = TARGETED.indexOf(inv.id) >= 0 ? chooseTarget(inv.id, win) : Promise.resolve(opponentsOf(S, me)[0]);
    tp.then(function (t) {
      if (t === null || t === undefined) return;
      if (TARGETED.indexOf(inv.id) >= 0) {
        var c2 = mpCanUse(C.S, me, uid, win, t);
        if (!c2.ok) { UI.flashStatus(c2.reason); return; }
      }
      return gather(it, uid, win, t).then(function (g) {
        if (!g || windowNow() !== win) return;
        sendAct({ t: 'item', u: uid, p: g.params, g: g.target });
      });
    });
  }

  /* ======================================================================
     5. RENDERING THE TABLE
     ====================================================================== */
  function livesText(n) { var s = ''; for (var i = 0; i < n; i++) s += '♥'; return s || '—'; }
  function secs(t) { return Math.max(0, Math.ceil((hostTime(t) - now()) / 1000)); }

  function myInventoryView() {
    var S = C.S, me = C.myIdx, p = S.players[me];
    var win = windowNow();
    return p.inventory.map(function (inv) {
      var it = ITEMS[inv.id];
      var chk = win ? mpCanUse(S, me, inv.uid, win, null) : { ok: false, reason: S.phase === 'play' ? 'ONLY ON YOUR TURN' : 'NOT RIGHT NOW' };
      if (C.pending) chk = { ok: false, reason: 'SENDING…' };
      return { uid: inv.uid, id: inv.id, item: it, usable: chk.ok, reason: chk.reason };
    });
  }

  function handsView(p) {
    return p.hands.map(function (h) {
      var hv = Cards.handValue(h.cards);
      return {
        cards: h.cards, mystery: h.cards.filter(function (c) { return c.mystery; }).length,
        total: hv.total, soft: hv.soft, bust: hv.total > 21, stood: h.stood, natural: isNatural(p)
      };
    });
  }

  function buildView() {
    var S = C.S, me = C.myIdx, spectating = me < 0;
    var p = spectating ? S.players[0] : S.players[me];
    var myTurn = !spectating && S.phase === 'play' && S.turn === me && alive(p) && !isDone(p) && !C.pending &&
      !S.asks.some(function (a) { return a.p === me; });
    var acts = myTurn ? availableActions(S, me, true) : [];
    var sh = S.fx.sh[me];
    function btn(a) { var lock = sh === a; return { enabled: myTurn && acts.indexOf(a) >= 0 && !lock, shackled: lock }; }
    var inv = spectating ? [] : myInventoryView();
    var turnName = S.turn !== null && S.turn !== undefined ? nameOf(S.turn) : '';

    var status = 'STANDBY', turnTag = '—';
    if (!alive(p)) { status = 'ELIMINATED · SPECTATING'; turnTag = 'OUT'; }
    else if (S.phase === 'play') {
      if (S.asks.some(function (a) { return a.p === me; })) { status = 'ANSWER THE PROMPT'; turnTag = 'YOU'; }
      else if (myTurn) { status = 'YOUR TURN · ' + secs(S.deadline) + 's'; turnTag = 'YOU'; }
      else if (C.pending) { status = 'SENDING…'; turnTag = 'YOU'; }
      else if (isDone(p)) { status = 'YOU ARE DONE · ' + turnName + ' PLAYING'; turnTag = turnName; }
      else { status = turnName + ' IS DECIDING · ' + secs(S.deadline) + 's'; turnTag = turnName; }
    } else if (S.phase === 'resolve') { status = S.asks.length ? 'WAITING FOR SEALED CARDS' : 'RESOLVING ROUND'; turnTag = 'REVEAL'; }
    else if (S.phase === 'inter') {
      var al = aliveIdx(S), rdy = al.filter(function (j) { return S.players[j].ready; }).length;
      status = 'INTERMISSION · ' + secs(S.deadline) + 's · ' + rdy + '/' + al.length + ' READY'; turnTag = 'BREAK';
    } else if (S.phase === 'over') { status = 'MATCH OVER'; turnTag = 'END'; }

    var effects = [];
    if (!spectating) {
      if (S.fx.tq[me]) effects.push({ t: 'TOURNIQUET ACTIVE · BLOCKS 1 LIFE', k: 'good' });
      if (S.fx.tqn[me]) effects.push({ t: 'TOURNIQUET READY FOR NEXT ROUND', k: 'good' });
      if (immune(S, me)) effects.push({ t: 'FLU SHOT · IMMUNE ' + S.fx.flu[me] + (S.fx.flu[me] > 1 ? ' ROUNDS' : ' ROUND'), k: 'good' });
      if (S.fx.hs[me]) effects.push({ t: 'HAND SAW ON YOU · BUST COSTS 2', k: 'bad' });
      if (S.fx.rp[me]) effects.push({ t: 'RAT POISON ON YOU · NEXT ITEM COSTS 1', k: 'bad' });
      if (sh) effects.push({ t: 'YOUR ' + ACTION_NAMES[sh] + ' IS SHACKLED', k: 'bad' });
      if (S.fx.cl[me]) effects.push({ t: 'YOUR ITEMS ARE CLAMPED', k: 'bad' });
    }
    S.players.forEach(function (q, j) {
      if (j === me || !alive(q)) return;
      if (S.fx.hs[j]) effects.push({ t: 'HAND SAW ON ' + q.name, k: 'good' });
      if (S.fx.rp[j]) effects.push({ t: 'RAT POISON ON ' + q.name, k: 'good' });
      if (S.fx.sh[j]) effects.push({ t: q.name + ' ' + ACTION_NAMES[S.fx.sh[j]] + ' LOCKED', k: 'good' });
      if (S.fx.cl[j]) effects.push({ t: q.name + ' ITEMS CLAMPED', k: 'good' });
    });
    if (S.players.some(function (q) { return q.doubled; }) && S.phase === 'play') effects.push({ t: 'STAKES DOUBLED · LOSERS LOSE 2', k: 'warn' });

    var hands = spectating ? [] : handsView(p);
    var reveal = S.phase === 'resolve' || S.phase === 'inter' || S.phase === 'over';
    var oppView, livesOpp, footer = null;
    if (S.mode === 'duel') {
      var oi = duelOpp(), o = S.players[oi];
      var xr = p.intel.x && p.intel.x.t === oi && hostTime(p.intel.x.u) > now() ? decList(p.intel.x.c) : null;
      var bn = p.intel.b && p.intel.b.t === oi ? p.intel.b.r + ' 15' + (p.intel.b.n !== cardCount(o) ? ' (STALE)' : '') : null;
      var ost = !alive(o) ? 'OUT' : S.phase === 'play' ? (allBusted(o) ? 'BUSTED' : isDone(o) ? 'STANDING' : S.turn === oi ? 'THINKING' : 'WAITING') : reveal ? 'REVEALED' : 'WAITING';
      oppView = {
        def: oppDef(oi), hands: o.hands.map(function (h) { return { count: h.cards.length, cards: h.cards, total: total(h), bust: total(h) > 21, stood: h.stood }; }),
        reveal: reveal, xray: xr, status: ost, shackled: S.fx.sh[oi] ? ACTION_NAMES[S.fx.sh[oi]] : null, burner: bn,
        cardCount: cardCount(o), itemCount: o.inventory.length, rage: 0, startLives: M().startLives, twins: false, doubled: o.doubled, split: o.split
      };
      livesOpp = o.lives;
    } else {
      oppView = { def: { id: 'ffa-' + S.id, name: 'FREE FOR ALL', alias: '', look: AVATARS[0], traits: {}, lines: {} }, hands: [], reveal: false, xray: null, status: '', shackled: null, burner: null, cardCount: 0, itemCount: 0, rage: 0, startLives: M().startLives, twins: false, doubled: false, split: false };
      livesOpp = aliveIdx(S).length;
      footer = S.players.map(function (q, j) {
        return '<span class="' + (alive(q) ? '' : 'dim') + '"><b>' + esc(j === me ? 'YOU' : q.name) + '</b> <em class="red">' + (alive(q) ? livesText(q.lives) : 'OUT') + '</em></span>';
      }).join('') + '<span><b>DECK</b> ' + deckSize(S) + '</span>';
    }

    var primary = null, primaryBusy = false;
    if (S.phase === 'inter' && alive(p) && !spectating) {
      primary = p.ready ? 'WAITING FOR OTHERS…' : 'READY ▸';
      primaryBusy = p.ready || !!C.pending;
    }

    return {
      phase: S.phase === 'inter' ? 'intermission' : S.phase,
      round: S.round, match: 1, matches: 1, matchLabel: S.mode === 'duel' ? 'ONLINE 1V1' : 'ONLINE FFA',
      maxLives: M().maxLives, startingLives: M().startLives,
      lives: { player: spectating ? 0 : p.lives, opp: livesOpp },
      tokens: spectating ? 0 : p.tokens, effects: effects, inventory: inv, invMax: M().inventoryMax,
      hands: hands,
      activeHand: !spectating && p.split && S.phase === 'play' && !isDone(p) ? focusIndex(p) : -1,
      split: !spectating && p.split, doubled: !spectating && p.doubled,
      buttons: {
        hit: btn('hit'), stand: { enabled: myTurn, shackled: false }, double: btn('double'), split: btn('split'),
        item: { enabled: myTurn && inv.some(function (x) { return x.usable; }) && sh !== 'item', shackled: sh === 'item' }
      },
      primary: primary, primaryBusy: primaryBusy, status: status, turnTag: turnTag, myTurn: myTurn,
      opp: oppView, log: C.log, footer: footer, logStatus: S.mode === 'duel' ? null : aliveIdx(S).length + ' STANDING',
      dread: !spectating && alive(p) && p.lives <= 1 ? 1 : (!spectating && p.lives === 2 ? 0.5 : 0)
    };
  }

  function render() {
    if (!C.S || C.stage !== 'match') return;
    var v = buildView();
    UI.render(v);
    var S = C.S;
    if (S.mode === 'duel') {
      var oi = duelOpp(), o = S.players[oi];
      $('oppName').textContent = o.name + ' · ONLINE' + (o.left ? ' · LEFT' : '');
      if (!alive(o)) UI.oppEliminated();
    } else {
      $('oppName').textContent = 'FREE FOR ALL · ' + aliveIdx(S).length + ' OF ' + S.players.length + ' STANDING';
      $('oppLivesTop').innerHTML = '';
      renderFFA();
    }
    if (S.phase === 'inter') renderInter();
  }

  function renderFFA() {
    var S = C.S, me = C.myIdx;
    var stage = $('oppStage');
    stage.classList.add('ffa');
    $('mon5').classList.add('ffa-mode');
    var grid = $('ffaGrid');
    if (!grid) { grid = document.createElement('div'); grid.id = 'ffaGrid'; grid.className = 'ffa-grid'; stage.appendChild(grid); }
    var others = [];
    S.players.forEach(function (q, j) { if (j !== me) others.push(j); });
    grid.className = 'ffa-grid n' + others.length;
    var reveal = S.phase === 'resolve' || S.phase === 'inter' || S.phase === 'over';
    var mine = me >= 0 ? S.players[me] : null;
    others.forEach(function (j) {
      var q = S.players[j];
      var cell = C.ffaCells[q.peer];
      if (!cell || !grid.contains(cell.el)) {
        var d = document.createElement('div');
        d.className = 'ffa-cell';
        d.innerHTML = '<div class="ffa-face">' + Face.build(AVATARS[q.av] || AVATARS[0]) + '</div><div class="ffa-info"></div>';
        grid.appendChild(d);
        cell = C.ffaCells[q.peer] = { el: d, svg: d.querySelector('svg'), info: d.querySelector('.ffa-info'), expr: '' };
      }
      var xr = mine && mine.intel.x && mine.intel.x.t === j && hostTime(mine.intel.x.u) > now() ? decList(mine.intel.x.c) : null;
      var cards = q.hands.map(function (h, hi) {
        var inner = '';
        h.cards.forEach(function (c) {
          var x = null;
          if (xr) xr.forEach(function (y) { if (y.uid === c.uid) x = y; });
          if (reveal) inner += miniCard(c, '');
          else if (x) inner += miniCard(x, ' xr');
          else inner += '<span class="mc back"></span>';
        });
        return '<span class="ffa-hand' + (reveal && total(h) > 21 ? ' busted' : '') + '">' + inner + (reveal ? '<em>' + total(h) + '</em>' : '') + (q.hands.length > 1 ? '<sub>H' + (hi + 1) + '</sub>' : '') + '</span>';
      }).join('');
      var st = !alive(q) ? (q.left ? 'LEFT' : 'OUT') : S.phase === 'play' ? (allBusted(q) ? 'BUST' : isDone(q) ? 'STOOD' : S.turn === j ? 'TURN · ' + secs(S.deadline) + 's' : '') : reveal ? '' : '';
      if (S.phase === 'inter' && alive(q)) st = q.ready ? 'READY' : 'SHOPPING';
      var bn = mine && mine.intel.b && mine.intel.b.t === j ? '<span class="ffa-intel">BURNER: ' + mine.intel.b.r + ' 15' + (mine.intel.b.n !== cardCount(q) ? ' (STALE)' : '') + '</span>' : '';
      var flags = (S.fx.sh[j] ? ' <b class="red">⛓</b>' : '') + (S.fx.cl[j] ? ' <b class="red">CLAMPED</b>' : '') + (immune(S, j) ? ' <b class="amber">IMMUNE</b>' : '') + (q.doubled ? ' <b class="amber">×2</b>' : '');
      cell.el.className = 'ffa-cell' + (S.turn === j && S.phase === 'play' ? ' turn' : '') + (alive(q) ? '' : ' out');
      cell.info.innerHTML =
        '<div class="ffa-name">' + esc(q.name) + flags + '</div>' +
        '<div class="ffa-lives">' + (alive(q) ? '<span class="red">' + livesText(q.lives) + '</span>' : 'ELIMINATED') + ' <span class="dim">· ' + q.inventory.length + ' ITEMS</span></div>' +
        '<div class="ffa-cards">' + (cards || '<span class="dim">—</span>') + '</div>' +
        '<div class="ffa-status">' + esc(st) + '</div>' + bn;
      var expr = !alive(q) ? 'dead' : 'neutral';
      if (S.res && reveal && alive(q)) {
        if (S.res.w.indexOf(j) >= 0) expr = 'celebrate';
        else if (S.res.l.some(function (x) { return x[0] === j; })) expr = 'hurt';
      } else if (S.phase === 'play' && allBusted(q)) expr = 'frustrated';
      else if (S.phase === 'play' && S.turn === j) expr = 'thinking';
      if (expr !== cell.expr) { cell.expr = expr; Face.apply(cell.svg, expr); }
    });
  }

  function miniCard(c, extra) {
    var v = c.wild ? c.mod : Cards.rankLabel(c);
    var cls = 'mc' + (c.red ? ' red' : '') + (c.wild ? ' wild' : '') + (extra || '');
    return '<span class="' + cls + '">' + esc(String(v)) + '<i>' + (c.wild ? '✱' : c.sym) + '</i></span>';
  }

  function renderInter() {
    var S = C.S, me = C.myIdx;
    if (me < 0 || !alive(S.players[me])) { if (C.overlay) { UI.hideOverlay(); C.overlay = false; } return; }
    var p = S.players[me], r = S.res || { w: [], l: [], s: [], why: '' };
    var sig = [S.round, p.tokens, p.inventory.length, p.bought, (p.shop || []).join('|'), p.ready ? 1 : 0].join(';');
    if (sig === C.interSig && C.overlay) return;
    C.interSig = sig;
    var won = r.w.indexOf(me) >= 0, lostEntry = null;
    r.l.forEach(function (x) { if (x[0] === me) lostEntry = x; });
    var head = won ? 'ROUND WON' : lostEntry ? 'ROUND LOST' : (r.w.length ? 'SAFE THIS ROUND' : 'DRAW');
    var myLabel = '';
    r.s.forEach(function (x) { if (x[0] === me) myLabel = x[1]; });
    var oppHands = [];
    S.players.forEach(function (q, j) { if (j !== me && q.hands.length) q.hands.forEach(function (h) { oppHands.push(h.cards); }); });
    var fake = {
      round: S.round, tokens: p.tokens, player: { inventory: p.inventory },
      shop: { items: p.shop || [], bought: p.bought },
      lastResult: {
        head: head, why: r.why, winner: won ? 'player' : lostEntry ? 'opp' : null,
        applied: lostEntry ? lostEntry[1] : 0, tokens: won ? M().tokensPerWin : 0,
        pT: myLabel, pB: myLabel === 'BUST', oppHands: oppHands,
        line: won ? '+' + M().tokensPerWin + ' TOKEN' : lostEntry ? (lostEntry[1] ? 'YOU LOST ' + lostEntry[1] + (lostEntry[1] > 1 ? ' LIVES' : ' LIFE') : 'TOURNIQUET HELD') : 'NO LIVES LOST'
      }
    };
    UI.showIntermission(fake);
    C.overlay = true;
    var nextBtn = document.querySelector('#m5Overlay [data-overlay="next"]');
    if (nextBtn) { nextBtn.textContent = p.ready ? 'WAITING FOR OTHERS…' : 'READY ▸'; nextBtn.disabled = p.ready; }
  }

  /* ======================================================================
     6. INPUT (routed here by game.js while a match is on)
     ====================================================================== */
  function active() { return C.stage === 'match' && !!C.S; }

  function onAction(kind) {
    FX.unlockAudio();
    var v = buildView();
    if (!v.myTurn) return;
    if (kind === 'item') { onInspect(null); return; }
    if (kind !== 'stand' && !(v.buttons[kind] && v.buttons[kind].enabled)) { FX.sfx('error'); return; }
    FX.sfx(kind === 'stand' ? 'click' : 'deal');
    sendAct({ t: kind });
  }

  function onPrimary() {
    var S = C.S, me = C.myIdx;
    if (!S || me < 0) return;
    if (S.phase === 'inter' && !S.players[me].ready) sendAct({ t: 'ready' });
  }

  function onInspect(uid) {
    if (!C.S || C.myIdx < 0) return;
    UI.openInventory(myInventoryView(), function (u) { useFlow(u); }, uid);
  }

  function onBuy(i) {
    var S = C.S, me = C.myIdx;
    if (!S || me < 0 || S.phase !== 'inter') return;
    var p = S.players[me];
    if (p.bought >= 1) { UI.flashStatus('ONE PURCHASE PER BREAK'); return; }
    if (p.tokens < M().shopPrice) { UI.flashStatus('NOT ENOUGH TOKENS'); FX.sfx('error'); return; }
    if (p.inventory.length >= M().inventoryMax) { UI.flashStatus('INVENTORY FULL'); FX.sfx('error'); return; }
    FX.sfx('item');
    sendAct({ t: 'buy', i: i });
  }

  function onMenu() {
    UI.modal({
      title: 'MENU', cls: 'menu', dismiss: null,
      html: '<p class="modal-text dim">Online match. Leaving counts as being eliminated' + (C.isHost ? ', and because you are hosting, it ends the match for everyone.' : '.') + '</p>',
      buttons: [
        { label: 'RESUME', value: null, isDefault: true },
        { label: 'HOW TO PLAY', value: 'how' },
        { label: 'SOUND: ' + (FX.settings.sound ? 'ON' : 'OFF'), value: 'sound' },
        { label: 'LEAVE MATCH', value: 'leave', cls: 'key-danger' }
      ]
    }).then(function (v) {
      if (v === 'sound') { FX.setSound(!FX.settings.sound); onMenu(); }
      else if (v === 'how') UI.showInfo('how', function () { UI.showScreen(null); });
      else if (v === 'leave') UI.confirm('LEAVE THE MATCH?', 'You will be eliminated from this table.', 'LEAVE').then(function (y) { if (y) leaveAll(true); });
    });
  }

  function onKey(ev) {
    var k = (ev.key || '').toLowerCase();
    if (k === 'escape') { onMenu(); ev.preventDefault(); return; }
    if (k === 'enter') { onPrimary(); return; }
    if (k === 'h') onAction('hit');
    else if (k === 's') onAction('stand');
    else if (k === 'd') onAction('double');
    else if (k === 'p') onAction('split');
    else if (k === 'i') onInspect(null);
    else if (/^[1-5]$/.test(k) && C.S && C.myIdx >= 0) {
      var inv = C.S.players[C.myIdx].inventory[parseInt(k, 10) - 1];
      if (inv) onInspect(inv.uid);
    }
  }

  /* ======================================================================
     7. MULTIPLAYER SCREENS (menu, searching, lobby)
     ====================================================================== */
  function avatarSVG(av) { return Face.build(AVATARS[av] || AVATARS[0]); }

  function renderMulti() {
    var body = $('multiBody');
    if (!body) return;
    var html = '';
    var note = C.notice ? '<p class="mp-notice" role="alert">' + esc(C.notice) + '</p>' : '';
    if (C.stage === 'connecting') {
