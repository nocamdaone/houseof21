<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of 21</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="fx-full">
<!-- HOUSE OF 21 — runs fully offline. No external requests, no modules, no installs. -->
<div id="app">

  <!-- =============================== THE ROOM =============================== -->
  <main id="room" class="room" aria-label="Game table">
    <div id="stage" class="stage">

      <!-- Layer 1: the basement wall, floor, props and the cables behind the TVs -->
      <div id="layerBg" class="layer layer-bg" aria-hidden="true">
        <img class="bg-img" src="assets/bg.webp" alt="">
        <img class="prop prop-barrel" src="assets/barrel.webp" alt="">
        <img class="prop prop-table" src="assets/table.webp" alt="">
        <canvas id="wiresBack" class="wires" width="1366" height="768"></canvas>
      </div>

      <!-- Layer 2: the four televisions -->
      <div id="layerFrames" class="layer layer-frames">
        <img class="tv-img" id="tvImgL" src="assets/tv-l.webp" alt="" data-tv="l">
        <img class="tv-img" id="tvImgR" src="assets/tv-r.webp" alt="" data-tv="r">
        <img class="tv-img" id="tvImgB" src="assets/tv-b.webp" alt="" data-tv="b">
        <img class="tv-img" id="tvImgM" src="assets/tv-m.webp" alt="" data-tv="m">
      </div>

      <!-- The dark outside the bulb's light (moves with the bulb) -->
      <div class="darkness-wrap" aria-hidden="true"><div id="darkness" class="darkness"></div><div id="blackout" class="blackout"></div></div>

      <!-- Layer 3: what is on the screens (self-lit, so above the dark) -->
      <div id="layerScreens" class="layer layer-screens">

        <!-- LEFT TV — INVENTORY -->
        <section class="scr" id="scrL" data-tv="l" aria-label="Inventory">
          <div class="scr-content" id="mon2">
            <header class="scr-head"><span>items</span><span class="scr-sub" id="invCount">0/5</span></header>
            <div class="scr-body" id="invBody"></div>
          </div>
          <div class="scr-glass"></div>
        </section>

        <!-- MIDDLE TV — THE OPPONENT -->
        <section class="scr" id="scrM" data-tv="m" aria-label="Opponent">
          <div class="scr-content" id="mon5">
            <header class="scr-head opp-head">
              <span id="oppName">—</span>
              <span class="opp-lives" id="oppLivesTop"></span>
            </header>
            <canvas class="ecg ecg-opp" id="ecgOpp" width="320" height="34" aria-hidden="true"></canvas>
            <div class="scr-body opp-stage" id="oppStage">
              <div class="opp-face" id="oppFace"></div>
              <div class="opp-speech" id="oppSpeech" aria-live="polite"></div>
              <div class="opp-cards" id="oppCards"></div>
              <div class="death-layer" id="deathLayer" aria-hidden="true"></div>
            </div>
          </div>
          <div class="scr-glass"></div>
        </section>

        <!-- BOTTOM TV — YOUR HAND + YOUR HEART -->
        <section class="scr" id="scrB" data-tv="b" aria-label="Your hand">
          <div class="scr-content" id="mon3">
            <header class="scr-head"><span>your hand</span><span class="scr-sub" id="handTotalTop"></span></header>
            <div class="hand-row">
              <div class="scr-body" id="handBody"></div>
              <div class="me-col" id="mon1">
                <canvas class="ecg ecg-me" id="ecgMe" width="120" height="44" aria-hidden="true"></canvas>
                <div class="me-stats" id="livesBody"></div>
              </div>
            </div>
          </div>
          <div class="scr-glass"></div>
        </section>

        <!-- RIGHT TV — TERMINAL: ACTIONS + LOG -->
        <section class="scr" id="scrR" data-tv="r" aria-label="Actions and log">
          <div class="scr-content term" id="mon4">
            <header class="scr-head"><span>root@house21:~$</span><span class="scr-sub" id="turnTag">—</span></header>
            <div class="act-status" id="actStatus">standby</div>
            <div class="act-grid" role="group" aria-label="Actions">
              <button class="key cmd" id="btnHit" data-act="hit" data-tip="hit [h] — draw another card.">hit <i>[h]</i></button>
              <button class="key cmd" id="btnStand" data-act="stand" data-tip="stand [s] — lock your current hand.">stand <i>[s]</i></button>
              <button class="key cmd" id="btnDouble" data-act="double" data-tip="double down [d] — draw exactly one card and stand. the round costs 2 lives either way. only on your first two cards.">double <i>[d]</i></button>
              <button class="key cmd" id="btnSplit" data-act="split" data-tip="split [p] — your first two cards share a value: play them as two hands. your best hand counts.">split <i>[p]</i></button>
              <button class="key cmd" id="btnItem" data-act="item" data-tip="use item [i] — open your inventory.">use_item <i>[i]</i></button>
            </div>
            <button class="key key-primary cmd" id="btnPrimary" hidden>deal</button>
            <div class="log-wrap" id="mon6">
              <div class="log-head"><span>/var/log/table</span><span id="logStatus">standby</span></div>
              <ol class="log-list" id="logList" aria-live="polite"></ol>
              <div class="log-footer" id="logFooter"></div>
            </div>
          </div>
          <div class="scr-glass"></div>
        </section>
      </div>

      <!-- The bulb (swings, flickers, lights the middle) -->
      <div id="bulbRig" class="bulb-rig" aria-hidden="true">
        <div class="bulb-cord"></div>
        <div class="beam" id="beam"></div>
        <img class="bulb-img" id="bulbImg" src="assets/bulb.webp" alt="">
        <div class="bulb-glow" id="bulbGlow"></div>
      </div>

      <!-- Layer 4: foreground cables, vignette -->
      <div id="layerFg" class="layer layer-fg" aria-hidden="true">
        <canvas id="wiresFront" class="wires" width="1366" height="768"></canvas>
      </div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="dread" aria-hidden="true"></div>
      <div class="splatter" id="splatter" aria-hidden="true"></div>
      <div class="banner" id="banner" aria-live="polite"></div>
    </div>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <!-- Close-up view of one TV -->
  <div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="Close-up">
    <div class="zoom-backdrop" id="zoomBack"></div>
    <div class="zoom-tv">
      <div class="zoom-screen" id="zoomScreen"></div>
      <div class="zoom-glass"></div>
      <button class="zoom-close key key-small" id="zoomClose" aria-label="Close close-up">back [esc]</button>
    </div>
  </div>

  <!-- ============================ FULL SCREENS ============================ -->
  <section class="screen-full" id="scrTitle" aria-label="Title">
    <div class="title-wrap">
      <div class="title-kicker">an underground tournament · 3 competitors · 3 lives</div>
      <h1 class="title-logo">HOUSE<span>OF</span>21</h1>
      <div class="title-menu">
        <button class="key key-menu" id="tContinue" hidden>CONTINUE</button>
        <button class="key key-menu" id="tNew">NEW GAME</button>
        <button class="key key-menu" id="tMulti">MULTIPLAYER</button>
        <button class="key key-menu" id="tHow">HOW TO PLAY</button>
        <button class="key key-menu" id="tCredits">CREDITS</button>
      </div>
      <div class="title-settings">
        <button class="key key-small" id="tSound">SOUND: ON</button>
        <button class="key key-small" id="tFx">EFFECTS: FULL</button>
        <button class="key key-small" id="tMusic">MUSIC: ON</button>
        <button class="key key-small" id="tMyMusic">YOUR MUSIC</button>
      </div>
      <p class="title-note">Fictional tokens only. No real money. Contains cartoon gore.</p>
    </div>
  </section>

  <section class="screen-full" id="scrStory" hidden aria-label="Story">
    <div class="story-wrap">
      <div class="story-portrait" id="storyPortrait"></div>
      <div class="story-panel">
        <div class="story-tag" id="storyTag"></div>
        <p class="story-text" id="storyText"></p>
        <div class="story-controls">
          <button class="key key-small" id="storySkip">SKIP</button>
          <button class="key key-primary" id="storyNext">CONTINUE ▸</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen-full" id="scrInfo" hidden aria-label="Information">
    <div class="info-wrap">
      <h2 class="info-title" id="infoTitle">HOW TO PLAY</h2>
      <div class="info-body" id="infoBody"></div>
      <button class="key key-primary" id="infoBack">BACK</button>
    </div>
  </section>

  <section class="screen-full" id="scrMulti" hidden aria-label="Multiplayer">
    <div class="multi-wrap" id="multiBody" data-stage=""></div>
  </section>

  <section class="screen-full" id="scrResult" hidden aria-label="Result">
    <div class="result-wrap">
      <div class="result-kicker" id="resultKicker"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="result-portrait" id="resultPortrait"></div>
      <p class="result-sub" id="resultSub"></p>
      <div class="result-actions">
        <button class="key key-primary" id="resultBtn">CONTINUE</button>
        <button class="key" id="resultBtn2" hidden>TITLE</button>
      </div>
    </div>
  </section>

  <!-- Menu button (in-game) -->
  <button class="menu-btn" id="menuBtn" hidden aria-label="Menu" data-tip="MENU [Esc]">≡</button>

  <!-- Intermission / dossier panel (a large CRT over the room) -->
  <div class="m5-overlay" id="m5Overlay" hidden></div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <canvas id="staticCanvas" class="static-canvas" aria-hidden="true"></canvas>
</div>

<!-- The fisheye: a displacement map that bends each screen like curved glass -->
<svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="fisheye" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feImage id="fishMap" result="map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none"/>
      <feDisplacementMap in="SourceGraphic" in2="map" id="fishDisp" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<script src="assets/art.js"></script>
<script src="config.js"></script>
<script src="cards.js"></script>
<script src="items.js"></script>
<script src="opponents.js"></script>
<script src="story.js"></script>
<script src="face.js"></script>
<script src="fx.js"></script>
<script src="music.js"></script>
<script src="scene.js"></script>
<script src="death.js"></script>
<script src="ui.js"></script>
<script src="net.js"></script>
<script src="mp.js"></script>
<script src="game.js"></script>
</body>
</html>
