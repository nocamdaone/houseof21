<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House of 21</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="fx-full">
<!-- HOUSE OF 21 — runs fully offline. No external requests, no modules, no installs. -->
<div id="app">

  <!-- =============================== THE ROOM =============================== -->
  <main id="room" class="room" aria-label="Game table">
    <!-- Layer 1: basement background -->
    <div id="layerBg" class="layer layer-bg" aria-hidden="true">
      <div class="wall"></div>
      <div class="pipe pipe-h p1"></div>
      <div class="pipe pipe-h p2"></div>
      <div class="pipe pipe-v p3"></div>
      <div class="pipe pipe-v p4"></div>
      <div class="jbox jb1"><span></span><span></span></div>
      <div class="jbox jb2"><span></span></div>
      <div class="bulb-cord"></div>
      <div class="bulb"></div>
      <div class="bulb-glow"></div>
      <div class="floor"></div>
    </div>

    <!-- Layer 2: monitor frames (each monitor's screen content is layer 3) -->
    <div id="layerFrames" class="layer layer-frames">
      <div class="console" id="console">

        <!-- MONITOR 1 — PLAYER STATUS (top left) -->
        <section class="monitor" id="mon1" aria-label="Player status">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>PLAYER STATUS</span><span class="led"></span></header>
              <div class="scr-body" id="livesBody"></div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;01</div>
          </div>
        </section>

        <!-- MONITOR 2 — INVENTORY (bottom left) -->
        <section class="monitor" id="mon2" aria-label="Inventory">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>INVENTORY</span><span class="scr-sub" id="invCount">0/5</span></header>
              <div class="scr-body" id="invBody"></div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;02</div>
          </div>
        </section>

        <!-- CENTER STACK -->
        <div class="center-stack">
          <!-- MONITOR 5 — OPPONENT (main center) -->
          <section class="monitor monitor-main" id="mon5" aria-label="Opponent">
            <div class="bezel">
              <div class="screen"><div class="screen-inner">
                <header class="scr-head opp-head">
                  <span id="oppName">—</span>
                  <span class="opp-lives" id="oppLivesTop"></span>
                </header>
                <div class="scr-body opp-stage" id="oppStage">
                  <div class="opp-face" id="oppFace"></div>
                  <div class="opp-speech" id="oppSpeech" aria-live="polite"></div>
                  <div class="opp-cards" id="oppCards"></div>
                  <div class="m5-overlay" id="m5Overlay" hidden></div>
                </div>
              </div><div class="scanlines"></div><div class="glare"></div></div>
              <div class="bezel-tag">MON&#8209;05 · LIVE FEED</div>
            </div>
          </section>

          <!-- MONITOR 6 — OPPONENT LOG (small center) -->
          <section class="monitor monitor-log" id="mon6" aria-label="Opponent log">
            <div class="bezel">
              <div class="screen"><div class="screen-inner">
                <header class="scr-head"><span>OPPONENT LOG</span><span class="scr-sub" id="logStatus">STANDBY</span></header>
                <div class="scr-body log-body">
                  <ol class="log-list" id="logList" aria-live="polite"></ol>
                  <div class="log-footer" id="logFooter"></div>
                </div>
              </div><div class="scanlines"></div><div class="glare"></div></div>
              <div class="bezel-tag">MON&#8209;06</div>
            </div>
          </section>
        </div>

        <!-- MONITOR 3 — PLAYER HAND (top right) -->
        <section class="monitor" id="mon3" aria-label="Your hand">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>YOUR HAND</span><span class="scr-sub" id="handTotalTop"></span></header>
              <div class="scr-body" id="handBody"></div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;03</div>
          </div>
        </section>

        <!-- MONITOR 4 — PLAYER ACTIONS (bottom right) -->
        <section class="monitor" id="mon4" aria-label="Actions">
          <div class="bezel">
            <div class="screen"><div class="screen-inner">
              <header class="scr-head"><span>ACTIONS</span><span class="scr-sub" id="turnTag">—</span></header>
              <div class="scr-body actions-body">
                <div class="act-status" id="actStatus">STANDBY</div>
                <div class="act-grid">
                  <button class="key" id="btnHit" data-act="hit" data-tip="HIT [H] — draw another card.">HIT</button>
                  <button class="key" id="btnStand" data-act="stand" data-tip="STAND [S] — lock your current hand.">STAND</button>
                  <button class="key" id="btnDouble" data-act="double" data-tip="DOUBLE DOWN [D] — draw exactly one card and stand. The round costs 2 lives either way. Only on your first two cards.">DOUBLE<br>DOWN</button>
                  <button class="key" id="btnSplit" data-act="split" data-tip="SPLIT [P] — your first two cards share a value: play them as two hands. Your best hand counts.">SPLIT</button>
                  <button class="key key-wide" id="btnItem" data-act="item" data-tip="USE ITEM [I] — open your inventory.">USE ITEM</button>
                </div>
                <button class="key key-primary" id="btnPrimary" hidden>DEAL</button>
              </div>
            </div><div class="scanlines"></div><div class="glare"></div></div>
            <div class="bezel-tag">MON&#8209;04</div>
          </div>
        </section>

      </div>
    </div>

    <!-- Layer 4: foreground cables and shadows -->
    <div id="layerFg" class="layer layer-fg" aria-hidden="true">
      <svg class="fg-cables" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <path d="M-20 820 C 160 760, 240 900, 420 930" fill="none" stroke="#050505" stroke-width="18" stroke-linecap="round"/>
        <path d="M-20 860 C 120 820, 260 940, 360 960" fill="none" stroke="#0b0b0a" stroke-width="10" stroke-linecap="round"/>
        <path d="M1460 780 C 1280 760, 1240 880, 1060 940" fill="none" stroke="#060606" stroke-width="16" stroke-linecap="round"/>
        <path d="M1460 40 C 1360 30, 1340 -10, 1280 -30" fill="none" stroke="#070707" stroke-width="12" stroke-linecap="round"/>
      </svg>
      <div class="vignette"></div>
      <div class="dread"></div>
    </div>

    <div class="banner" id="banner" aria-live="polite"></div>
  </main>

  <!-- ============================ FULL SCREENS ============================ -->
  <section class="screen-full" id="scrTitle" aria-label="Title">
    <div class="title-wrap">
      <div class="title-kicker">AN UNDERGROUND TOURNAMENT · 3 COMPETITORS · 3 LIVES</div>
      <h1 class="title-logo">HOUSE<span>OF</span>21</h1>
      <div class="title-menu">
        <button class="key key-menu" id="tContinue" hidden>CONTINUE</button>
        <button class="key key-menu" id="tNew">NEW GAME</button>
        <button class="key key-menu" id="tMulti">MULTIPLAYER</button>
        <button class="key key-menu" id="tHow">HOW TO PLAY</button>
        <button class="key key-menu" id="tCredits">CREDITS</button>
      </div>
      <div class="title-settings">
        <button class="key key-small" id="tSound">SOUND: ON</button>
        <button class="key key-small" id="tFx">EFFECTS: FULL</button>
      </div>
      <p class="title-note">Fictional tokens only. No real money. Works offline.</p>
    </div>
  </section>

  <section class="screen-full" id="scrStory" hidden aria-label="Story">
    <div class="story-wrap">
      <div class="story-portrait" id="storyPortrait"></div>
      <div class="story-panel">
        <div class="story-tag" id="storyTag"></div>
        <p class="story-text" id="storyText"></p>
        <div class="story-controls">
          <button class="key key-small" id="storySkip">SKIP</button>
          <button class="key key-primary" id="storyNext">CONTINUE ▸</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen-full" id="scrInfo" hidden aria-label="Information">
    <div class="info-wrap">
      <h2 class="info-title" id="infoTitle">HOW TO PLAY</h2>
      <div class="info-body" id="infoBody"></div>
      <button class="key key-primary" id="infoBack">BACK</button>
    </div>
  </section>

  <section class="screen-full" id="scrMulti" hidden aria-label="Multiplayer">
    <div class="multi-wrap" id="multiBody" data-stage=""></div>
  </section>

  <section class="screen-full" id="scrResult" hidden aria-label="Result">
    <div class="result-wrap">
      <div class="result-kicker" id="resultKicker"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="result-portrait" id="resultPortrait"></div>
      <p class="result-sub" id="resultSub"></p>
      <div class="result-actions">
        <button class="key key-primary" id="resultBtn">CONTINUE</button>
        <button class="key" id="resultBtn2" hidden>TITLE</button>
      </div>
    </div>
  </section>

  <!-- Menu button (in-game) -->
  <button class="menu-btn" id="menuBtn" hidden aria-label="Menu" data-tip="MENU [Esc]">≡</button>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <canvas id="staticCanvas" class="static-canvas" aria-hidden="true"></canvas>
</div>

<script src="config.js"></script>
<script src="cards.js"></script>
<script src="items.js"></script>
<script src="opponents.js"></script>
<script src="story.js"></script>
<script src="face.js"></script>
<script src="fx.js"></script>
<script src="ui.js"></script>
<script src="net.js"></script>
<script src="mp.js"></script>
<script src="game.js"></script>
</body>
</html>
